# Единственный маршрут наружу: страница чтения.
#
# Описан файлом, а не метками контейнеров, и это выбор, а не привычка. Метки
# читаются через сокет докера, а сокет в контейнере - это право поднимать любой
# другой контейнер на этой машине. Стек рядом объявляет о себе обратное:
# файловая система только на чтение, никаких лишних прав, ничего сверх данного.
# Маршрут у нас один и не меняется, так что за метки платить нечем.
http:
  routers:
    page:
      rule: "Host(`{{ env "DASHBOARD_HOST" }}`)"
      entryPoints: [https]
      service: page
      tls:
        certResolver: letsencrypt

  services:
    page:
      loadBalancer:
        servers:
          - url: "http://page:8080"
