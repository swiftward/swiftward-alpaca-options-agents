# The only way out of the agent's network. Everything not named in filter.txt is
# refused, and the refusal is logged - a session reaching for a host nobody
# declared is something we want to see, not something to allow quietly.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
Filter "/etc/tinyproxy/filter.txt"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
ConnectPort 443
# The policy gateway does not listen on 443. Without this the tunnel to it is
# refused by the proxy itself, before the allowlist is even consulted.
ConnectPort 8443
