name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
        working-directory: golang
      # -count=1 always, for the same reason golang/Makefile passes it: several
      # tests read the declarations and the skills, and Go caches a result against
      # the Go files it compiled, which those are not. A cached pass on a file
      # that has since broken is a guard that lies, and it cost a crash-looping
      # agent on 26 August.
      - run: go test -count=1 ./...
        working-directory: golang
      - run: go build ./...
        working-directory: golang
      # The race detector, because the failures this project has met are between
      # goroutines: the clock and the room both starting a turn, a watcher reading
      # what a test writes. A suite that only runs single-threaded says nothing
      # about either.
      - run: go test -race -count=1 ./...
        working-directory: golang

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: typescript/web
      # `npm run build` is `tsc --noEmit && vite build`: the page has no unit
      # tests, and this is the check that can actually fail - an identifier that
      # does not resolve, an import that is gone.
      - run: npm run build
        working-directory: typescript/web
