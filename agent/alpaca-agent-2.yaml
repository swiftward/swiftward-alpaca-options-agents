kind: trading-agent
name: alpaca-agent-2
version: "1"
timezone: America/New_York

# The same engine, one difference: we sell CLOSER to the money.
#
# The experiment answers one question, and it is also the main complaint against
# the first account - its trades collect pennies. A sold leg at a delta near 0.15
# sits far from price, loses rarely and pays almost nothing. A leg at a delta near
# 0.30 sits twice as close: it pays several times more and loses noticeably more
# often. Which of the two is better is not settled by argument - it is settled by
# two accounts on the same day.
#
# Everything else matches alpaca-agent-1.yaml on purpose: size from the loss, the
# portfolio limit as a sum of maximum losses, the execution ladder, an intent
# recorded before the order. EXACTLY ONE thing may differ, or there is nothing to
# compare.


# Which techniques this agent receives at all. The name is what stands at the head
# of SKILL.md. It belongs to the agent rather than to a session: the agent reads
# the catalogue of techniques once, at startup, and one process serves every
# session, so there is nothing to narrow the set with per window. Which technique
# to take is still said by the task in words. The set is narrowed because every
# technique's description enters the prompt of EVERY turn.
skills:
  - playbook-premium-harvest
  - playbook-earnings-crush
  - read-my-envelope

# The numbers this agent carries out its techniques with. A technique holds the
# mechanics and an EXAMPLE number; the number actually applied lives here - two
# accounts run the same technique deliberately, and the difference between them is
# the whole experiment. A skill declares in its header (`requires:`) which numbers
# it needs; without them the agent does not start and says which is missing.
# They stand at the head of EVERY turn - whether a window woke it, a wake-up of the
# session's own, or a person in the chat - so they need not be repeated in a
# window's text; a window that needs a different number need only say so itself.
parameters:
  # This account sold CLOSER to the money than its neighbour from 27 to 29 August,
  # and that was the whole experiment: the near leg is paid several times more and
  # is reached far more often, and which wins is a question two accounts answer on
  # the same prices rather than an argument.
  #
  # It answered. Over four days on live prices the far account stood at 102,700
  # and this one at 98,273 - the near leg lost 1,727 while the far one made 2,700.
  # So this account now runs the neighbour's setting, and the reason is not the
  # size of the gap but which days are left: Monday to Thursday are the only days
  # that count, and running a setting our own record shows losing, through the
  # only four days that are scored, is a bet against our own evidence. The
  # experiment gave what it was opened for and has nothing further to give.
  short_leg_delta: "no more than 0.30 in absolute value; within that, edge_points decides"
  # The second account stands FURTHER along the curve than the first, and that is
  # its role in the three. Over 646 trading days: at 0 the expectation is near
  # zero - the sign changes between 0 and +1 - at +2 it is plus 2.63, at +3 plus
  # 4.14. "Strictly above 0" stood here until 28 August and meant trading exactly
  # on the point where the sign changes. We take +3: the most per trade, the
  # fewest trades, and deliberately a different angle from the neighbour's +2.
  min_edge_points: "at least +3 on fresh quotes; within what qualifies, take the highest"
  min_edge_points_borrowed: "strictly above 0: borrowed volatility overstates the edge"
  # Three, as on the neighbour. The two accounts now run one setting, so a number
  # that differs between them is a difference nobody chose.
  daily_fuse_percent: "3"

  # The earnings layer's two numbers, taken verbatim from the declaration that
  # has been running it. The second is the measure this whole week has been
  # circling, done properly: implied against realised, per NAME, with a threshold
  # - and it already turns the trade around where the ratio is low instead of
  # refusing it.
  crush_worst_case_share: "no more than 3% of equity"
  # MEASURED on 29 August, and the half that was missing is the realised one.
  # Fourteen AVGO reports since 2023, the move net of the market on each:
  #
  #   median 8.0%, quartiles 5.9% and 10.6%
  #   an ordinary day, measured the same way: 1.1%
  #   so a report is 7.2 times an ordinary day
  #
  # Against a realised median of 8.0% the ratios below mean: SELL when the implied
  # move is 10.4% or more, BUY when it is 6.4% or less, and take nothing between.
  # The session still works the implied move out itself from the chain on the day -
  # this is the number it compares against, and until now it had none.
  #
  # The report day is identified rather than given: the largest single-day move of
  # each March, June, September and December, which is when this name reports. The
  # largest of the QUARTER instead catches market-wide days - April 2025 and
  # January 2025 both came out that way and neither is an earnings move. The
  # market is subtracted for the same reason. `research/earnings_move.py`.
  crush_implied_over_realized: "sell at 1.3 or above; at 0.8 or below buy the move instead of selling; in between take nothing. AVGO has moved a median of 8.0% net of the market on its last 14 reports, so this is 10.4% to sell and 6.4% to buy"

  # When a winner is bought back, as a share of the credit it was opened for.
  # Measured over the minute-by-minute path of 553 trades across 646 days: held
  # to expiry the rule returns 2,287 dollars with 26% losing trades, closed here
  # it returns 6,292 with 9%. The close is charged the full width of the book and
  # the fee, twice - `research/threshold.py` in the team's own repository.
  #
  # It lives here rather than in the deployment because it is a TRADING decision,
  # and every other one is here. Until 29 August it was TAKE_PROFIT_AT in the
  # environment, which also meant the two accounts could not differ in it without
  # differing in how they were deployed.
  take_profit_at: "0.35"

  # What a structure must clear to be OFFERED at all. Seven numbers, and every one
  # of them is a trading decision - how far the sold leg sits, how likely it is to
  # be reached, what the structure must pay, what the crossing may cost. Until
  # 29 August they were environment variables, which put the screener's choices in
  # a different place from every other trading choice and made changing one a
  # redeployment.
  #
  # They are read on EVERY sweep, so lowering a bar is one edit here and the next
  # pass obeys. A number missing or unreadable stops that pass rather than
  # loosening it: a threshold quietly reading zero does not narrow the list, it
  # opens it, and every structure clears a floor of zero.
  screener_nearest: "0.1"
  screener_furthest: "3.0"
  screener_least_paid: "8"
  screener_most_paid: "100"
  # 100, not 150, and it is the list's density rather than the trades. Measured on
  # 3,336 real candidates from our own record: `edge_points` falls monotonically
  # with what the crossing costs and turns NEGATIVE above 120% of the credit -
  # +3.2 below 15%, +1.4 at 75-90%, -0.4 at 120-135%, -0.6 at 135-150%. At 150
  # the sweep kept 171 rows whose average structure cannot clear its own
  # break-even. The entry threshold of +3 refuses them anyway, so no trade was
  # ever at stake; they simply took room in a list a session reads.
  screener_dearest: "100"
  # 0.30, not 0.45, and the two numbers were fighting each other. The rule tells
  # the session "no more than 0.30" while this told the screener to OFFER up to
  # 0.45 - so the list handed to a session contained structures its own rule would
  # refuse, and the only thing keeping them out was the session's discipline.
  #
  # Measured over 646 trading days of SPY and QQQ (`research/grid.py`): 0.30 beats
  # 0.45 everywhere on the grid, not at one point - fewer trades, enough more
  # expectation on each to win on the total - and at 0.40 the expectation turns
  # NEGATIVE: selling that close pays less than it costs. So the wider list was
  # not more choice, it was a list with losing structures in it, ranked by a
  # measure that cannot see the difference.
  screener_most_delta: "0.30"
  screener_least_edge: "-3.0"

sessions:
  - name: open-check
    cause: "the start of the day: what is on the account and what is left from yesterday"
    at: "09:35"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Say in one line: the equity, how many positions are left from yesterday, and
      what their combined maximum loss is. Open nothing and close nothing.

  # NO FRIDAY, and it is the event's arithmetic rather than a preference. Alpaca
  # takes the account's equity at the END OF THURSDAY 3 September; LabLab counts
  # at 15:00 UTC on Friday, which is 11:00 in New York. So a position opened on
  # that Friday cannot reach the first number at all, and has four hours to hurt
  # the second one. The rules and both dates are in `docs/rules.md` of the team's
  # own repository.
  # THE EXPERIMENT THIS ACCOUNT CARRIES: WHEN to enter, and what to ask at each
  # hour. Taken from the declaration that is ahead on the money, unchanged.
  #
  # The first account tries every ten minutes from 09:45 to 15:15 with ONE bar all
  # day. These three windows are the other idea, and it is not "enter less often":
  # **how much of the day is left decides how much the structure must pay.** At
  # 10:20 a whole day of movement lies ahead, so the premium has to be dear - a
  # credit of at least 13% of the risk, and one underlying at most. At 12:30 the
  # position lives half a session and the ordinary rule applies. 14:20 is the main
  # window.
  #
  # Measured 29 August: that declaration sent 40 orders and made 4,082 dollars
  # against this engine's 173 and 2,700. Everything else here matches the first
  # account deliberately - the same playbook, the same leg distance, the same
  # thresholds, the same limits - so the week says something about the hours
  # rather than about six differences at once.
  # NO FRIDAY, and it is the event's arithmetic rather than a preference. Alpaca
  # takes the account's equity at the END OF THURSDAY 3 September; LabLab counts
  # at 15:00 UTC on Friday, which is 11:00 in New York. So a position opened on
  # that Friday cannot reach the first number at all, and has four hours to hurt
  # the second one. The rules and both dates are in `docs/rules.md` of the team's
  # own repository.
  - name: entry-morning
    cause: "morning entry window, taken only when premium is dear"
    at: "10:20"
    within: 45m
    days: [mon, tue, wed, thu]
    task: |
      **This window runs EVERY trading day. There is exactly one exception:
      4 September 2026.** Ask the clock and check the date:
      - today is NOT 4 September 2026 - carry on with this window as usual;
      - today IS 4 September 2026 - open nothing, say so in one line and finish:
        submissions close at 11:00 New York time, the result is counted at that
        moment, and anything done after it is not counted at all.
      There is no other reading: a date that does not match is NOT a reason to
      finish.
      A morning entry is not taken every day: a whole day of movement lies ahead,
      so the premium has to be dear by a measure visible in the chain itself.
      Run premium-harvest with two tightenings, both in our favour: enter only an
      underlying whose best structure pays a credit-to-risk of at least 13%, and
      no more than one underlying in this window.
      If none clears it, say in one line what each of them paid and finish.

  # NO FRIDAY, and it is the event's arithmetic rather than a preference. Alpaca
  # takes the account's equity at the END OF THURSDAY 3 September; LabLab counts
  # at 15:00 UTC on Friday, which is 11:00 in New York. So a position opened on
  # that Friday cannot reach the first number at all, and has four hours to hurt
  # the second one. The rules and both dates are in `docs/rules.md` of the team's
  # own repository.
  - name: entry-midday
    cause: "midday entry window: a position taken here lives half a session"
    at: "12:30"
    within: 40m
    days: [mon, tue, wed, thu]
    task: |
      **This window runs EVERY trading day. There is exactly one exception:
      4 September 2026.** Ask the clock and check the date:
      - today is NOT 4 September 2026 - carry on with this window as usual;
      - today IS 4 September 2026 - open nothing, say so in one line and finish:
        submissions close at 11:00 New York time, the result is counted at that
        moment, and anything done after it is not counted at all.
      There is no other reading: a date that does not match is NOT a reason to
      finish.
      The midday entry window. Run premium-harvest.
      The rule lives in the skill in full and is not repeated here. Your limits -
      what one position and the whole book may lose, which underlyings, which
      expirations - come from the envelope (read_envelope). They are not in this
      text and they will not be.

  # NO FRIDAY, and it is the event's arithmetic rather than a preference. Alpaca
  # takes the account's equity at the END OF THURSDAY 3 September; LabLab counts
  # at 15:00 UTC on Friday, which is 11:00 in New York. So a position opened on
  # that Friday cannot reach the first number at all, and has four hours to hurt
  # the second one. The rules and both dates are in `docs/rules.md` of the team's
  # own repository.
  - name: entry
    cause: "the main entry window of the day"
    at: "14:20"
    within: 45m
    days: [mon, tue, wed, thu]
    task: |
      **This window runs EVERY trading day. There is exactly one exception:
      4 September 2026.** Ask the clock and check the date:
      - today is NOT 4 September 2026 - carry on with this window as usual;
      - today IS 4 September 2026 - open nothing, say so in one line and finish:
        submissions close at 11:00 New York time, the result is counted at that
        moment, and anything done after it is not counted at all.
      There is no other reading: a date that does not match is NOT a reason to
      finish.
      The main entry window of the day. Run premium-harvest.

  - name: earnings-crush
    # The cause names a CONDITION, not a fact. It used to read "AVGO reports
    # tonight", and on any other Wednesday that was untrue - in the record and on
    # the page a judge reads. The date itself is right: on 28 August six news
    # sources agreed on 2 September, and the date check stands in the task below.
    cause: "the earnings window: if a report lands after the close tonight, sell what the unknown has inflated"
    at: "15:20"
    within: 30m
    days: [wed]
    task: |
      **Check the date first.** This session is written for the AVGO report of
      2 September 2026. Ask the clock (get_clock). If today is not 2 September,
      say so in one line and finish without doing anything: the weekday matched,
      the date did not.
      Then run earnings-crush on AVGO.
      The report comes after the close, so take the expiration that comes AFTER
      it - the one expiring today dies before the reaction and carries none of
      the event.
      The MEASUREMENT decides the side, not an opinion: work out the implied move
      and the median of what this name has actually done on past reports, and say
      both numbers out loud.

  - name: earnings-crush-exit
    cause: "the report landed last night: the crush happened at the open, what follows is drift"
    at: "09:35"
    within: 30m
    days: [thu]
    task: |
      **Check the date first.** This session is written for the morning of
      3 September 2026 - the morning after the AVGO report. Ask the clock. If
      today is not 3 September, say so in one line and finish. If the earnings
      layer holds no position, say that and finish too.
      **Close what this layer holds, whatever it turned out to be.** Yesterday's
      measurement could have sent it either way: usually a sold iron condor, but
      on an inverted ratio a bought backspread. Both come out this morning.
      The condor goes as one opposing mleg order, all four legs at once.
      Do not confuse the earnings backspread with the convexity layer: that one
      lives for days, this one was bought for a single report, the report has
      happened, and the volatility it was bought on falls all day.
      The crush happens at the open; everything after is drift, and this structure
      was not hired to hold drift. Do not wait for the last cent of decay.
      If price went through the short strike, close anyway and say what it cost:
      the structure did its job by bounding the loss, and holding it for a
      recovery is a different trade nobody decided to make.
      Confirm with the broker that the position is gone, and name the price you
      actually got.

  - name: defend
    cause: "price has reached the sold strike"
    every: 15m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Do not deal with entry orders: the harness leads them.
      If no positions are open, say so in one line and end.
      Close a position if the underlying's price has passed the sold strike - for a
      put that is price below the strike, for a call above it.
      - **If price has gone past the BOUGHT leg, do not close.** With both legs in
        the money the spread's loss already equals the width and grows no further:
        it is bounded by construction. Closing then saves nothing, pays the
        crossing, and gives up the last thing left - the chance the underlying
        comes back before expiry. Close only while price is BETWEEN the sold and
        the bought strike: there the loss is still growing, and stopping it has a
        point.
        A live case from 26 August: META 575/577.5 call with price at 583 - past
        both legs - and the close was offered at 2.50 on a width of 2.50, that is
        at the full loss plus the crossing.
      The near leg is crossed more often here than on the neighbouring account:
      that is expected and is the price of being paid more.
      Close nothing else: a spread lives on time decay, and a position closed early
      pays the crossing twice and collects half.
      Otherwise name the current result on each position and touch nothing.

  # The last day of the submission week is counted NOT at the market's close:
  # submissions close on 4 September at 11:00 New York, and everything open at that
  # minute enters the result at a mark we do not know. An ordinary flatten at 15:50
  # would be four hours late.
  #
  # It stands here because the account for judging is not yet chosen: a window that
  # does not exist cannot be added retroactively on the day it is needed.
  - name: flatten-before-the-deadline
    cause: "the result is counted at 11:00, not at the close"
    at: "10:15"
    within: 30m
    days: [fri]
    task: |
      **This window is silent EVERY Friday. There is exactly one exception:
      4 September 2026.**
      Ask the broker's clock (get_clock) and check the date:
      - today is NOT 4 September 2026 - say "not the day" in one line and end the
        turn; read nothing and touch nothing;
      - today is 4 September 2026 - carry on with this window.
      There is no other reading of this.

      Submissions close at 11:00 New York, and the result is counted on the account
      as of that minute. An open position enters it at the broker's mark, not as
      money.
      Close everything that closes without costing more than holding it is worth.
      Name and leave a position that closes for more than its mark - closing for the
      sake of a round account costs money too.
      Name each decision in one line: what you closed, what you left, and why.

  - name: flatten
    cause: "close what risks assignment today"
    at: "15:35"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Close positions in options expiring TODAY whose underlying has come nearer to
      the sold strike than the WIDTH of the structure itself. Not "nearer than fifty
      cents": that number is from the days when a position was one to five
      contracts, while the width is a measure of the structure itself and grows
      with it.
      There is exactly one danger: price closing BETWEEN the legs. Then the sold leg
      is exercised, the bought one expires empty, and instead of a bounded loss
      there is a position in SHARES. The width is the size of that gap; anything
      beyond it cannot fall in.
      Count what you risk rather than what the buy-back costs: the buy-back is
      bounded and known, an exercise is not.
      Let the rest of today's expiries expire.
      Do not touch positions with a later expiry.
      Name the day's result as one number: equity against yesterday's close.
