# Пробная декларация: ею работает счёт для разработки до кикоффа.
#
# Отличается от сдаваемой (agent.yaml) тремя вещами, и всё три - ради скорости
# обучения, а не ради прибыли: вход пробуется каждые полчаса вместо трёх окон,
# позиция всегда в один контракт, а защита ходит вдвое чаще. На этом счёте
# ошибка стоит ноль, а наблюдение стоит одного хода, поэтому наблюдений нужно
# много. Сдаваемая декларация остаётся какой была.
#
# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha-experiment
version: v1
timezone: America/New_York

# Какие приёмы этот агент вообще получает. Имя - то, что стоит в шапке SKILL.md.
# Уровень агента, а не сессии: агент читает каталог приёмов один раз, когда
# запускается, и один процесс обслуживает все сессии, так что сузить набор под
# отдельное окно нечем. Какой приём взять, по-прежнему говорит задача словами.
# Набор сужают потому, что описание каждого приёма уходит в промпт КАЖДОГО хода.
skills:
  - playbook-premium-harvest
  - read-my-envelope

# Числа, с которыми этот агент выполняет свои приёмы. Приём держит механику и
# ПРИМЕР числа; число, которое действительно применяется, живёт здесь - два счёта
# гоняют один и тот же приём нарочно, и разница между ними и есть весь опыт.
# Скил объявляет в шапке (`requires:`), какие числа ему нужны; не дали - агент не
# стартует и говорит, какого не хватает.
# Они встают в начало КАЖДОГО хода - неважно, разбудило ли окно, собственное
# пробуждение сессии или человек в чате, - поэтому в тексте окон их повторять не
# надо; окну, которому нужно другое число, достаточно сказать это у себя.
parameters:
  # Дистанция здесь не цель, а потолок: внутри него решает edge_points. 26 августа
  # потолок дельты 0,25 отверг ORCL (+3,5), TSLA (+1,6) и INTC (+1,5) и не оставил
  # ничего взамен.
  short_leg_delta: "не больше 0,45 по модулю; внутри этого решает edge_points"
  min_edge_points: "наибольшее в списке; небольшой минус допустим - обычная мера ошибается в занижающую сторону"
  min_edge_points_borrowed: "строго больше 0: занятая волатильность завышает преимущество"
  daily_fuse_percent: "3"

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции: часть из них открыта вчера и истекает сегодня.
      Назови деньги, покупательную способность и по каждой позиции - когда она истекает.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  # Каждые десять минут, а не двадцать. Список кандидатов переписывается раз в три
  # минуты, и преимущество на нём живёт недолго: 26 августа лучшая строка стояла
  # с +7,5, а через несколько минут по свежим котировкам давала −7,2. Окно в
  # двадцать минут означало, что шесть-семь версий списка сессия не увидит вовсе,
  # а увиденную застанет уже протухшей.
  - name: entry
    cause: "проба входа: смотрим, проходит ли конструкция и что отвечает брокер"
    every: 10m
    between: ["09:45", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Это счёт для разработки и пробный прогон. Ценность хода - в наблюдении, а не
      в прибыли: нам нужно знать, что заявка уходит, чем отвечает брокер и что
      попадает в запись.
      Правило входа целиком, ничего не додумывай:
      **Где эта задача и скил расходятся - права ЗАДАЧА.** Скил описывает приём в
      общем виде и написан для всех счетов сразу; числа в нём - пример, а не закон.
      Если здесь сказано другое про дельту, сторону, порог или стоимость прохода -
      делай, как здесь, и скажи одной строкой, в чём разошлось. Молча взять число
      из скила вместо числа из задачи - это отменить опыт, ради которого счёт и
      существует.
      - **Бумаги ищи не сам: спроси read_candidates.** Скринер оценил за тебя весь
        разрешённый список - сотни бумаг, обе стороны, каждые пять минут - и отдаёт
        готовый перечень: страйки, кредит, риск, отношение одного к другому,
        стоимость прохода и `credit_after_cost` - кредит за вычетом половины этой
        стоимости, то есть то, чего заявка по середине стоит на деле. Перебирать бумаги руками означает
        успеть посмотреть шесть штук, и шесть - это те, что достались по очереди, а
        не лучшие: сегодня из шести не прошла ни одна, притом что MU платил 25,5%.
        Если read_candidates недоступен или список пуст - скажи это одной строкой и
        закончи ход. Своими руками перебор не начинай: он съест ход, а за ходом
        ждут защита и закрытие.
      - Список - это то, что рынок ПРЕДЛАГАЕТ, а не то, что тебе следует взять.
        Фильтры скринера мягче твоих нарочно. Свои проверь заново по каждой
        конструкции, которую собираешься брать.
      - Экспирация: та, что разрешает КОНВЕРТ, и никакая другая - своего срока у
        тебя нет. Сегодняшняя разрешена; как её мерить, сказано ниже отдельным
        правилом. Ближняя распадается быстрее, дальняя чаще проходит пороги - бери
        ту, что лучше измеряется.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта по
        модулю не больше 0,45, и внутри этого решает не она. Купленная - дальше от
        денег; НАСКОЛЬКО дальше, решает скринер, он оценивает все ширины до пяти
        страйков. У обеих ног должна быть двусторонняя котировка.
        Отдельного порога на отношение кредита к риску у тебя нет: это отношение
        целиком сидит внутри `edge_points` (безубыточная вероятность и есть
        риск/(кредит+риск)), поэтому порог рядом с мерой - второе место, где живёт
        то же знание, и он уже стоил нам сделки: 26 августа лучший call-кандидат
        дня с преимуществом +1,4 был отброшен за 9,29% против «не хуже 10».
        Почему не 0,15, как было: сегодняшние числа говорят, что зарабатывает или
        теряет конструкцию СТОИМОСТЬ ПРОХОДА, а не дистанция. Утренняя сделка с
        проходом в 6% кредита в плюсе; вчерашние дальние с проходом в 30% в минусе.
        Дистанция - это предпочтение по риску, и держать её жёстче, чем требует
        предел, значит отказываться от дешёвых конструкций ради красивой дельты.
      - **Отбирай по полю `edge_points`, а не по дельте.** Оно говорит, на сколько
        процентных пунктов конструкция платит БОЛЬШЕ того, что должна пережить:
        шанс проданного страйка уцелеть по дельте брокера минус доля выигрышей,
        нужная этому кредиту для безубытка. Положительное - рынок платит за этот
        риск больше, чем сам же его оценивает.
        Ни одна половина не решает в одиночку, и 26 августа это стоило дня: потолок
        дельты 0,25 отверг ORCL (+3,5), TSLA (+1,6) и INTC (+1,5), оставив взамен
        ничего. Бери из списка с наибольшим `edge_points`, при равном - с более
        дешёвым проходом.
        Это ОТБОР, а не обещание: дельта - риск-нейтральная вероятность, и спред не
        теряет всю ширину при касании страйка. Поэтому размер по-прежнему от
        конверта, а не от уверенности.
      - **Не продавай премию на бумаге, у которой ОТЧЁТ до истечения конструкции.**
        Перед отчётом премия высокая, и мера отбора `edge_points` показывает её как
        преимущество - но она считает вероятность по дельте, а перед событием
        распределение двугорбое: дельта занижает хвост, ради которого премию и
        платят. Продажа премии в событие - это толстый ЛЕВЫЙ хвост, то есть ровно
        то, чего мандат велит избегать.
        Живой случай 26 августа: скринер предложил NVDA 207,5/205 put с
        `edge_points` +6,38 в день отчёта NVDA, и заявка была снята вручную. Хуже
        того, она гасила бы нашу же ставку на это событие: put-backspread платит
        при сильном падении, а этот спред при нём теряет.
        Отчёт узнавай новостями (`get_news`) или спроси у news-watch. Правило
        срабатывает на ПОДТВЕРЖДЁННУЮ дату до истечения, а не на молчание ленты.
        Лента ничего не сказала - скажи это одной строкой и бери: молчание не есть
        свидетельство. 26 августа вето по молчанию сняло с основного счёта DELL и
        AMD, у которых отчёта в окне не было вовсе, - то есть правило начало
        стоить сделок там, где хвоста, ради которого оно написано, нет.
        Хвост требует НАЗНАЧЕННОГО события; отсутствие сведений события не создаёт.
        На событие мы ставим ПОКУПКОЙ выпуклости, а не продажей премии.
      - **Конструкции, истекающие СЕГОДНЯ, разрешены, но их мера СЛАБЕЕ, и это
        меняет порог.** В день истечения брокер не даёт ни дельты, ни
        волатильности - замерено 26 августа: из 28 контрактов QQQ, истекающих в
        тот день, ни один не нёс ни того, ни другого. Поэтому волатильность взята
        у ближайшей другой экспирации той же бумаги, и `edge_from` говорит
        «borrowed from another expiration».
        **Где мера занята - требуй преимущество СТРОГО БОЛЬШЕ НУЛЯ,** а не просто
        лучшее в списке. Причина в направлении ошибки: у самого короткого срока
        волатильность обычно ВЫШЕ, чем у следующих за ним, поэтому занятое число
        занижает, как часто цена доходит до страйка, и завышает преимущество.
        Обычная мера ошибается в другую сторону - занижает преимущество, - и
        поэтому там мы принимаем и небольшой минус. Здесь не принимаем.
        Почему это важно знать. Однодневка платит куда больше: замер 26 августа в
        17:15, за 2ч45м до закрытия, QQQ в 0,15% от цены платил 49% риска при
        стоимости прохода 6% кредита, тогда как всё, что истекает через один-пять
        дней, платило 8-15% при стоимости прохода 20-100%. Но платят там больше
        ровно потому, что цена туда доходит чаще, и мера это уже учитывает.
        Одно ограничение сверх меры: **не бери страйк ближе четверти процента от
        цены.** Там наибольшая часть платы приходится на последние минуты, когда
        отменить или защититься уже нельзя.
        И второе, про наши же часы: **однодневную конструкцию не открывай, когда
        до закрытия меньше сорока пяти минут.** Защита просыпается раз в
        пятнадцать минут, а лестница ведёт заявку до восьми - позиция, открытая
        позже, не может быть защищена НИ РАЗУ, и это не про величину риска, а про
        то, что механизм до неё не дотягивается. Посчитай время сам по часам
        брокера.
      - **Не продавай премию на бумаге, у которой ОТЧЁТ до истечения конструкции.**
        Перед отчётом премия высокая, и мера отбора `edge_points` показывает её как
        преимущество - но она считает вероятность по дельте, а перед событием
        распределение двугорбое: дельта занижает хвост, ради которого премию и
        платят. Продажа премии в событие - это толстый ЛЕВЫЙ хвост, то есть ровно
        то, чего мандат велит избегать.
        Живой случай 26 августа: скринер предложил NVDA 207,5/205 put с
        `edge_points` +6,38 в день отчёта NVDA, и заявка была снята вручную. Хуже
        того, она гасила бы нашу же ставку на это событие: put-backspread платит
        при сильном падении, а этот спред при нём теряет.
        Отчёт узнавай новостями (`get_news`) или спроси у news-watch. Не уверен,
        есть ли отчёт, - не бери: пропущенная сделка стоит ноль, а эта стоит хвоста.
        На событие мы ставим ПОКУПКОЙ выпуклости, а не продажей премии.
      - Однодневные конструкции разрешены и здесь, на тех же условиях, что у
        put-стороны: там про них написано полностью, и второй раз это не
        пересказывается. Число, живущее в двух местах, расходится.
      - **Преимущество обязано быть БОЛЬШЕ НУЛЯ. Лучшее в списке - не то же самое,
        что годное.** Список ранжирован, и первая строка в нём стоит первой даже
        когда весь список отрицательный: тогда правильный ход - не входить.
        Отрицательное преимущество означает, что рынок платит МЕНЬШЕ, чем стоит
        риск по мнению того же рынка, - это медленная потеря, а не риск.
        26 августа это стоило заявки на 906 наборов с преимуществом −2,81, снятой
        вручную.
      - **Размер считай по ХУДШЕЙ цене, которую сам объявишь, а не по середине.**
        Ты отправляешь заявку по середине и пишешь в `client_order_id` худшую
        приемлемую цену; лестница ведёт заявку от первой ко второй. Кредит на
        худшей цене МЕНЬШЕ, значит убыток набора БОЛЬШЕ - и позиция, влезавшая в
        предел по середине, из него выпадает.
        Живой случай 26 августа: 234 набора при кредите по середине 0,36 дают
        худший исход 14 976 (предел 14 989, влезает), а по объявленной худшей цене
        0,31 - уже 16 146, то есть мимо. Лестница судит заявку по объявленной
        худшей цене и такую снимет.
        Поэтому: посчитай убыток набора как (ширина минус ХУДШИЙ кредит) × 100,
        и число наборов бери от него.
      - **Размер считай от `position_max_loss` конверта, а НЕ от покупательной
        способности.** Максимальный убыток набора - это ШИРИНА между страйками,
        умноженная на сто, минус полученный кредит; число наборов - целое вниз от
        предела конверта, делённого на этот убыток. Отказ брокера по нехватке
        покупательной способности означает, что счёт ошибся на порядок, а не что
        надо подставить остаток покупательной способности: 26 августа после такого
        отказа размер был пересчитан ВВЕРХ, под весь остаток, то есть впятеро выше
        разрешённого. Получил такой отказ - остановись и скажи, сколько насчитал и
        сколько разрешено.
      - Стоимость входа отдельным порогом больше НЕ проверяется, и своего числа
        для неё у тебя нет. Скринер вычитает половину спреда bid-ask обеих ног из
        кредита ещё до всех измерений и показывает результат полем
        `credit_after_cost`; `edge_points` считается по нему. Дорогая конструкция
        поэтому сама показывает низкое преимущество и проигрывает дешёвой в общем
        списке - отдельное правило было бы вторым местом, где живёт то же знание.
        Замерено 26 августа: конструкция с кредитом 0,22 при спреде 0,16 измерялась
        на семь пунктов ЛУЧШЕ той, что платит 0,15 при спреде 0,02, - и зарабатывает
        вторая. Порог в пятую часть при этом выбрасывал за проход 833 конструкции
        против 96 у следующего фильтра, то есть решал день в одиночку.
        Сравнивай `credit_after_cost` с `credit`, когда хочешь понять, сколько
        конструкция отдаёт на входе, но отбирай по `edge_points`.
      - Размер: максимальный убыток позиции не больше того, что назвал КОНВЕРТ в
        `position_max_loss`. Числа здесь нет и не будет: оператор меняет его в
        одном месте, и следующая сессия видит новое значение без перезапуска.
        Капитал прочитай у брокера, не подставляй из головы; контрактов - целое вниз.
        Механика доказана, теперь позиция должна быть заметной: при кредите 14 центов
        и риске 86 это порядка тридцати контрактов, а не одного.
      - Размер НЕ зависит от того, чем кончилась предыдущая сделка. Ни после
        проигрыша, ни после выигрыша он не меняется: увеличение после проигрыша - это
        мартингейл, на котором фонды теряют капитал за один день.
      - Бери из списка ЛУЧШИЕ по `edge_points`. Стоимость прохода уже вычтена из
        кредита внутри этой меры, поэтому отдельно её взвешивать не надо.
        Открывай до ШЕСТИ новых позиций за окно, каждую по своим фильтрам.
        Не набрал шести - значит их сейчас нет, и это нормальный ответ.
      - Не открывай вторую позицию ТОЙ ЖЕ СТОРОНЫ на ту же бумагу с той же экспирацией.
        Put-спред и call-спред на одной бумаге - две разные позиции, вместе они и есть
        обе стороны рынка: проиграть обе сразу нельзя, цена уходит либо вверх, либо вниз.
        **И брокер это знает.** Он держит залог по ХУДШЕЙ из двух сторон, а не по
        их сумме, поэтому вторая сторона на ту же бумагу и ту же экспирацию берётся
        почти бесплатно по капиталу, а кредит собирает свой. Замерено 26 августа на
        основном счёте: сумма худших исходов по группам «бумага + день» дала 26 347
        при капитале 99 728, и опционная покупательная способность была 73 535 -
        разница 26 193, то есть брокер держит ровно ту величину, которую мы сами и
        считаем, уже с зачётом обеих сторон.
        Практический вывод: если по бумаге открыта одна сторона и вторая проходит
        по преимуществу - бери её, это лучший обмен риска на кредит, который вообще
        есть в этой книге.
        Предел ставится по РИСКУ, а не по числу позиций: сложи максимальные убытки
        всех открытых конструкций и сравни с тем, что назвал конверт в
        `portfolio_max_loss`. Своего числа здесь нет.
        Двенадцать позиций по одному контракту это полтора процента риска, то есть
        не предел, а недобор. Сверх этого держи здравый потолок в тридцать позиций,
        чтобы ход не разросся.
      - Спроси read_volatility_history по этой бумаге и напиши полученный ранг в тезисе
        намерения. Если замеров меньше пятидесяти - так и напиши, что истории ещё нет.
        Ранг сейчас ни на что не влияет и ничего не запрещает: мы копим данные, чтобы
        через неделю проверить на своих же сделках, отличается ли результат входов при
        высоком ранге от входов при низком. Практики называют это главным улучшением
        2025 года, а рецензируемого подтверждения у него нет - вот и проверим сами.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой лимитом по середине, а в client_order_id заявки
        напиши худшую цену, по которой согласен исполниться, в виде worst=-0.11
        (для кредита цена отрицательная), и через точку с запятой что-нибудь
        неповторяющееся - брокер отказывает, если такое имя он уже видел
        (client_order_id must be unique). Например worst=-0.11;QQQ703-702-1226. Ниже этой цены харнесс не пойдёт никогда,
        а до неё доведёт сам: шагает к цене стакана, ждёт на каждой цене, и отменяет,
        если стакан так и не взял. Сам за заявкой не следи.
        Худшая цена обязана удовлетворять тому же правилу, что и вход: пересчитай
        по НЕЙ преимущество так же, как считает скринер - вероятность уцелеть
        минус риск/(кредит+риск) по этой цене, - и оно должно остаться выше того
        порога, по которому ты входил. Иначе мы соглашаемся исполниться по цене,
        которую сами же признали негодной. Сверх этого - отдавать не больше трети
        полученного кредита; берётся та из двух границ, что уступает меньше.
      - Одной строкой скажи: вошёл или нет, и если нет - какое ПРЕИМУЩЕСТВО было у
        лучшей конструкции по каждой бумаге и чем она не подошла. Это и есть
        наблюдение.
      - В той же строке, где говоришь результат, назови два числа со счёта: капитал
        сейчас и сколько кредита держат открытые позиции. Отдельным ходом об этом
        не отчитывайся - он стоит дороже, чем сообщает.

  - name: entry-call
    cause: "проба другой стороны: продажа call-спреда выше денег"
    every: 10m
    between: ["09:50", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Та же проба, но с другой стороны рынка. Эту конструкцию мы ещё ни разу не
      проверяли живой заявкой, а она удваивает кредит по бумаге, не увеличивая
      риск позиции: убыток по каждой стороне ограничен своей шириной, и обе
      стороны одновременно проиграть не могут.
      - **Бумаги ищи не сам: спроси read_candidates и работай по его списку.**
        Тебе нужна сторона call: бери из списка те, где `type` равен `call`.
        Список пуст или инструмент недоступен - скажи это одной строкой и закончи.
      - Экспирация: та, что разрешает конверт. Сегодняшняя разрешена и здесь, на
        условиях, описанных у put-стороны.
      - Конструкция: продажа вертикального call-спреда. Проданная нога - дельта по
        модулю не больше 0,45. **Отбирай по `edge_points` из списка скринера, а не
        по дельте:** оно говорит, на сколько пунктов конструкция платит больше того,
        что должна пережить. Бери наибольшее, при равном - дешевле проход.
        Купленная - дальше от денег, ширину выбирает скринер.
      - Обе ноги с двусторонней котировкой. Порога на отношение кредита к риску
        нет и здесь, по той же причине, что у put-стороны. Но преимущество больше
        нуля обязательно и здесь: лучший call дня с преимуществом −2,81 брать не
        надо, надо не входить.
      - Стоимость входа отдельным порогом не проверяется: она вычтена из кредита
        внутри `edge_points`, ровно как на put-стороне. Дорогая конструкция сама
        показывает низкое преимущество.
      - Размер: максимальный убыток позиции не больше того, что назвал конверт в
        `position_max_loss`; число контрактов целое вниз. Не больше одной такой позиции на бумагу с одной экспирацией.
      - Открывай до ШЕСТИ новых позиций за окно. Не набрал шести - значит их
        сегодня нет, и это нормальный ответ.
      - Запиши намерение (record_intent) до заявки и отправь ОДНОЙ заявкой лимитом
        по середине, указав в client_order_id худшую цену и неповторяющийся хвост,
        например worst=-0.11;QQQ703-702-1226: брокер отказывает, если имя уже видел.
      - Одной строкой: вошёл или нет и какое преимущество было у лучшей конструкции.
      - В той же строке, где говоришь результат, назови два числа со счёта: капитал
        сейчас и сколько кредита держат открытые позиции. Отдельным ходом об этом
        не отчитывайся - он стоит дороже, чем сообщает.

  - name: take-profit
    cause: "проба закрытия: путь закрытия позиции мы ещё не проходили живьём"
    every: 15m
    between: ["09:50", "15:40"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Здесь мы проверяем закрытие, которого ещё ни разу не делали живой заявкой.
      **Только кредитные вертикали: одна проданная нога и одна купленная, обе
      одного типа и одной экспирации, по одному контракту на ногу.** Всё остальное
      не трогай вовсе. Слой выпуклости (backspread: одна проданная нога против ДВУХ
      купленных) существует ради дня сильного движения, и закрыть его ради процента
      от кредита - значит выбросить именно ту страховку, ради которой он куплен.
      Если конструкция не вертикаль, скажи это одной строкой и пройди мимо.
      Посмотри открытые позиции по спредам. Если конструкция уже отдала половину
      полученного кредита - закрой её встречной заявкой ОДНОЙ mleg-заявкой
      (купить проданную ногу, продать купленную), лимитом по середине, и укажи в
      client_order_id худшую цену в виде worst=0.09 (для закрытия цена
      положительная - это дебет).
      Если таких позиций нет, скажи одной строкой, сколько каждая отдала, и закончи.
      Заявку дальше не веди: её доводит харнесс.

  - name: probe-close
    cause: "проба закрытия: путь «открыл - закрыл» нужно пройти сегодня, а не ждать истечения"
    at: "12:20"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      Это намеренная проверка закрытия, а не сделка по правилу. Правило закрытия
      ждёт половины кредита, а половина у однодневного спреда собирается к самому
      истечению - значит путь закрытия мы сегодня не увидим, если не пройдём его
      специально. Пара центов убытка здесь - плата за наблюдение.
      - Возьми САМУЮ СТАРУЮ открытую конструкцию. Если открытых нет - скажи это
        одной строкой и закончи.
      - Запиши намерение (record_intent): в тезисе прямо напиши, что это проверка
        пути закрытия.
      - Закрой её встречной ОДНОЙ mleg-заявкой (купить проданную ногу, продать
        купленную), лимитом по середине, и укажи в client_order_id худшую цену в
        виде worst=0.20 с неповторяющимся хвостом - при закрытии цена положительная,
        это дебет.
      - Дальше заявку не веди, её доводит харнесс. Скажи одной строкой: что закрыл,
        по какой цене открывал, какой лимит поставил, капитал и собранный кредит.

  - name: probe-expiry
    cause: "проба истечения: увидеть истечение сегодня, а не ждать завтрашнего утра"
    at: "12:50"
    within: 25m
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверяем путь, которого мы ещё не видели: что происходит с конструкцией в
      день её истечения. Поэтому здесь - и только здесь - берём СЕГОДНЯШНЮЮ
      экспирацию, хотя дельт по ней брокер не считает.
      - Бумага: SPY. Экспирация: сегодняшняя.
      - Страйк выбирай по расстоянию от цены, а не по дельте: проданная нога
        примерно на 0,4-0,6% ниже текущей цены SPY, купленная - на страйк ниже.
      - Один контракт. Обе ноги должны иметь двустороннюю котировку.
      - Запиши намерение, в тезисе прямо напиши, что это проверка истечения.
      - Отправь одной mleg-заявкой лимитом по середине, в client_order_id укажи
        худшую цену с неповторяющимся хвостом.
      - Скажи одной строкой: что открыл, какой кредит, капитал, собранный кредит.

  - name: probe-condor
    cause: "проба четырёхногой конструкции: движок crush собирается торговать именно её"
    at: "13:05"
    within: 25m
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверяем механику конструкции из четырёх ног одной заявкой - её мы не
      отправляли ни разу, а движок под отчёт AVGO собирается торговать именно такую.
      - Бумага: SPY, экспирация завтрашняя.
      - Конструкция: железный кондор из четырёх ног ОДНОЙ mleg-заявкой: продать put
        около дельты -0,15 и купить put на страйк ниже; продать call около дельты
        +0,15 и купить call на страйк выше.
      - Один контракт. Все четыре ноги с двусторонней котировкой.
      - Запиши намерение, в тезисе напиши, что это проверка четырёхногой заявки.
      - Отправь ОДНОЙ заявкой лимитом по середине, худшую цену укажи в client_order_id.
      - Скажи одной строкой: приняли или отказали и что именно ответил брокер. Отказ
        здесь тоже результат - тогда назови его дословно и не повторяй заявку.

  - name: probe-tools
