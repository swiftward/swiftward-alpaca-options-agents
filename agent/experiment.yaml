      Вызови по одному разу и назови одной строкой на каждый, что пришло и годится
      ли это нам: движения рынка за день (market movers), самые активные бумаги,
      история капитала счёта (portfolio history), корпоративные события по SPY, QQQ,
      IWM на ближайший месяц, и поиск по документации API, если такой инструмент есть.
      Если инструмента нет в списке - так и скажи, не выдумывай.

  - name: probe-refusal
    cause: "проба отказа: как выглядит отказ брокера и умеем ли мы его не повторять"
    at: "12:45"
    within: 30m
    days: [mon, tue, wed, thu, fri]
    task: |
      Это намеренная проверка отказа, а не торговля. Нам нужно увидеть, как выглядит
      отказ брокера и что попадает в запись.
      Отправь заведомо непроходимую заявку: тот же put-спред, что и обычно, но
