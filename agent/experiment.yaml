# Пробная декларация: ею работает счёт для разработки до кикоффа.
#
# Отличается от сдаваемой (agent.yaml) тремя вещами, и всё три - ради скорости
# обучения, а не ради прибыли: вход пробуется каждые полчаса вместо трёх окон,
# позиция всегда в один контракт, а защита ходит вдвое чаще. На этом счёте
# ошибка стоит ноль, а наблюдение стоит одного хода, поэтому наблюдений нужно
# много. Сдаваемая декларация остаётся какой была.
#
# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha-experiment
version: v1
timezone: America/New_York

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции: часть из них открыта вчера и истекает сегодня.
      Назови деньги, покупательную способность и по каждой позиции - когда она истекает.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry
    cause: "проба входа: смотрим, проходит ли конструкция и что отвечает брокер"
    every: 20m
    between: ["09:45", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Это счёт для разработки и пробный прогон. Ценность хода - в наблюдении, а не
      в прибыли: нам нужно знать, что заявка уходит, чем отвечает брокер и что
      попадает в запись.
      Правило входа целиком, ничего не додумывай:
      **Где эта задача и скил расходятся - права ЗАДАЧА.** Скил описывает приём в
      общем виде и написан для всех счетов сразу; числа в нём - пример, а не закон.
      Если здесь сказано другое про дельту, сторону, порог или стоимость прохода -
      делай, как здесь, и скажи одной строкой, в чём разошлось. Молча взять число
      из скила вместо числа из задачи - это отменить опыт, ради которого счёт и
      существует.
      - **Бумаги ищи не сам: спроси read_candidates.** Скринер оценил за тебя весь
        разрешённый список - сотни бумаг, обе стороны, каждые пять минут - и отдаёт
        готовый перечень: страйки, кредит, риск, отношение одного к другому и
        стоимость прохода в процентах от кредита. Перебирать бумаги руками означает
        успеть посмотреть шесть штук, и шесть - это те, что достались по очереди, а
        не лучшие: сегодня из шести не прошла ни одна, притом что MU платил 25,5%.
        Если read_candidates недоступен или список пуст - скажи это одной строкой и
        закончи ход. Своими руками перебор не начинай: он съест ход, а за ходом
        ждут защита и закрытие.
      - Список - это то, что рынок ПРЕДЛАГАЕТ, а не то, что тебе следует взять.
        Фильтры скринера мягче твоих нарочно. Свои проверь заново по каждой
        конструкции, которую собираешься брать.
      - Экспирация: любая из тех, где брокер считает чувствительности, но не дальше
        пяти торговых дней. Сегодняшнюю не трогай: в день истечения дельт нет ни на
        одном потоке, страйк выбрать не по чему. Ближняя распадается быстрее, дальняя
        чаще проходит пороги - бери ту, что проходит.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта по
        модулю НЕ БОЛЬШЕ 0,25; внутри этого выбирай не самую дальнюю, а ту, у
        которой дешевле проход. Купленная - на один страйк ниже. У обеих ног должна
        быть двусторонняя котировка, отношение кредита к риску не хуже 10%.
        Почему не 0,15, как было: сегодняшние числа говорят, что зарабатывает или
        теряет конструкцию СТОИМОСТЬ ПРОХОДА, а не дистанция. Утренняя сделка с
        проходом в 6% кредита в плюсе; вчерашние дальние с проходом в 30% в минусе.
        Дистанция - это предпочтение по риску, и держать её жёстче, чем требует
        предел, значит отказываться от дешёвых конструкций ради красивой дельты.
      - Стоимость входа и выхода считается ДО решения: сложи спред bid-ask обеих ног.
        Если он больше ПЯТОЙ ЧАСТИ полученного кредита - конструкция не годится, какой
        бы красивой ни выглядела доля кредита к риску. Порог ужесточён с трети до пятой
        части 26 августа, и вот почему. Утренняя сделка, которая пошла в плюс: кредит к
        риску 22% при стоимости прохода 6% кредита. Вчерашние дневные, которые в минусе:
        кредит к риску 10-17% при стоимости прохода 30% и выше. Разница между
        «зарабатывает» и «не зарабатывает» - именно эта цифра, а не размер позиции.
        Замерено 25 августа: у DIA доля 20,5% при стоимости прохода 0,13 против кредита
        0,085 - то есть минус.
      - Размер: максимальный убыток позиции не больше того, что назвал КОНВЕРТ в
        `position_max_loss`. Числа здесь нет и не будет: оператор меняет его в
        одном месте, и следующая сессия видит новое значение без перезапуска.
        Капитал прочитай у брокера, не подставляй из головы; контрактов - целое вниз.
        Механика доказана, теперь позиция должна быть заметной: при кредите 14 центов
        и риске 86 это порядка тридцати контрактов, а не одного.
      - Размер НЕ зависит от того, чем кончилась предыдущая сделка. Ни после
        проигрыша, ни после выигрыша он не меняется: увеличение после проигрыша - это
        мартингейл, на котором фонды теряют капитал за один день.
      - Бери из списка ЛУЧШИЕ по стоимости прохода, а не по кредиту: именно проход
        отделяет то, что зарабатывает, от того, что съедает себя на входе.
        Открывай до ШЕСТИ новых позиций за окно, каждую по своим фильтрам.
        Не набрал шести - значит их сейчас нет, и это нормальный ответ.
      - Не открывай вторую позицию ТОЙ ЖЕ СТОРОНЫ на ту же бумагу с той же экспирацией.
        Put-спред и call-спред на одной бумаге - две разные позиции, вместе они и есть
        обе стороны рынка: проиграть обе сразу нельзя, цена уходит либо вверх, либо вниз.
        Предел ставится по РИСКУ, а не по числу позиций: сложи максимальные убытки
        всех открытых конструкций и сравни с тем, что назвал конверт в
        `portfolio_max_loss`. Своего числа здесь нет.
        Двенадцать позиций по одному контракту это полтора процента риска, то есть
        не предел, а недобор. Сверх этого держи здравый потолок в тридцать позиций,
        чтобы ход не разросся.
      - Предохранитель: если капитал ниже вчерашнего закрытия на 3% и больше - на сегодня
        хватит, скажи это одной строкой и закончи.
      - Спроси read_volatility_history по этой бумаге и напиши полученный ранг в тезисе
        намерения. Если замеров меньше пятидесяти - так и напиши, что истории ещё нет.
        Ранг сейчас ни на что не влияет и ничего не запрещает: мы копим данные, чтобы
        через неделю проверить на своих же сделках, отличается ли результат входов при
        высоком ранге от входов при низком. Практики называют это главным улучшением
        2025 года, а рецензируемого подтверждения у него нет - вот и проверим сами.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой лимитом по середине, а в client_order_id заявки
        напиши худшую цену, по которой согласен исполниться, в виде worst=-0.11
        (для кредита цена отрицательная), и через точку с запятой что-нибудь
        неповторяющееся - брокер отказывает, если такое имя он уже видел
        (client_order_id must be unique). Например worst=-0.11;QQQ703-702-1226. Ниже этой цены харнесс не пойдёт никогда,
        а до неё доведёт сам: шагает к цене стакана, ждёт на каждой цене, и отменяет,
        если стакан так и не взял. Сам за заявкой не следи.
        Худшая цена обязана удовлетворять тому же правилу, что и вход: отношение
        кредита к риску по НЕЙ, а не по запрошенной цене, не хуже 10%. Иначе мы
        соглашаемся исполниться по цене, которую сами же признали негодной для
        входа. Сверх этого - отдавать не больше трети полученного кредита; берётся
        та из двух границ, что уступает меньше. Пример: спред шириной 5 долларов,
        кредит по середине 0,67. Десять процентов риска дают худшую цену 0,46 (при
        кредите 0,46 риск 4,54); треть кредита дала бы 0,45. Уступает меньше первая,
        значит worst=-0.46.
      - Одной строкой скажи: вошёл или нет, и если нет - какое отношение кредита к риску
        было у лучшей конструкции по каждой бумаге. Это и есть наблюдение.
      - В той же строке, где говоришь результат, назови два числа со счёта: капитал
        сейчас и сколько кредита держат открытые позиции. Отдельным ходом об этом
        не отчитывайся - он стоит дороже, чем сообщает.

  - name: entry-call
    cause: "проба другой стороны: продажа call-спреда выше денег"
    every: 20m
    between: ["09:50", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Та же проба, но с другой стороны рынка. Эту конструкцию мы ещё ни разу не
      проверяли живой заявкой, а она удваивает кредит по бумаге, не увеличивая
      риск позиции: убыток по каждой стороне ограничен своей шириной, и обе
      стороны одновременно проиграть не могут.
      - **Бумаги ищи не сам: спроси read_candidates и работай по его списку.**
        Тебе нужна сторона call: бери из списка те, где `type` равен `call`.
        Список пуст или инструмент недоступен - скажи это одной строкой и закончи.
      - Экспирация: любая с чувствительностями, но не дальше пяти торговых дней.
      - Конструкция: продажа вертикального call-спреда. Проданная нога - дельта по
        модулю не больше 0,25; внутри этого бери ту, у которой дешевле проход.
        Купленная - на один страйк ВЫШЕ.
      - Отношение кредита к риску не хуже 10%, обе ноги с двусторонней котировкой.
      - Стоимость входа и выхода считается ДО решения: сложи спред bid-ask обеих ног.
        Больше пятой части полученного кредита - конструкция не годится. Это тот же
        фильтр, что и у put-стороны, и он тут отсутствовал: именно он отделяет
        конструкцию, которая зарабатывает, от той, которая съедает себя на входе.
      - Размер: максимальный убыток позиции не больше того, что назвал конверт в
        `position_max_loss`; число контрактов целое вниз. Не больше одной такой позиции на бумагу с одной экспирацией.
      - Открывай до ШЕСТИ новых позиций за окно, но только те, что прошли фильтр
        прохода. Не набрал шести - значит их сегодня нет, и это нормальный ответ.
      - Запиши намерение (record_intent) до заявки и отправь ОДНОЙ заявкой лимитом
        по середине, указав в client_order_id худшую цену и неповторяющийся хвост,
        например worst=-0.11;QQQ703-702-1226: брокер отказывает, если имя уже видел.
      - Одной строкой: вошёл или нет и какое отношение было у лучшей конструкции.
      - В той же строке, где говоришь результат, назови два числа со счёта: капитал
        сейчас и сколько кредита держат открытые позиции. Отдельным ходом об этом
        не отчитывайся - он стоит дороже, чем сообщает.

  - name: take-profit
    cause: "проба закрытия: путь закрытия позиции мы ещё не проходили живьём"
    every: 15m
    between: ["09:50", "15:40"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Здесь мы проверяем закрытие, которого ещё ни разу не делали живой заявкой.
      **Только кредитные вертикали: одна проданная нога и одна купленная, обе
      одного типа и одной экспирации, по одному контракту на ногу.** Всё остальное
      не трогай вовсе. Слой выпуклости (backspread: одна проданная нога против ДВУХ
      купленных) существует ради дня сильного движения, и закрыть его ради процента
      от кредита - значит выбросить именно ту страховку, ради которой он куплен.
      Если конструкция не вертикаль, скажи это одной строкой и пройди мимо.
      Посмотри открытые позиции по спредам. Если конструкция уже отдала половину
      полученного кредита - закрой её встречной заявкой ОДНОЙ mleg-заявкой
      (купить проданную ногу, продать купленную), лимитом по середине, и укажи в
      client_order_id худшую цену в виде worst=0.09 (для закрытия цена
      положительная - это дебет).
      Если таких позиций нет, скажи одной строкой, сколько каждая отдала, и закончи.
      Заявку дальше не веди: её доводит харнесс.

  - name: probe-close
    cause: "проба закрытия: путь «открыл - закрыл» нужно пройти сегодня, а не ждать истечения"
    at: "12:20"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      Это намеренная проверка закрытия, а не сделка по правилу. Правило закрытия
      ждёт половины кредита, а половина у однодневного спреда собирается к самому
      истечению - значит путь закрытия мы сегодня не увидим, если не пройдём его
      специально. Пара центов убытка здесь - плата за наблюдение.
      - Возьми САМУЮ СТАРУЮ открытую конструкцию. Если открытых нет - скажи это
        одной строкой и закончи.
      - Запиши намерение (record_intent): в тезисе прямо напиши, что это проверка
        пути закрытия.
      - Закрой её встречной ОДНОЙ mleg-заявкой (купить проданную ногу, продать
        купленную), лимитом по середине, и укажи в client_order_id худшую цену в
        виде worst=0.20 с неповторяющимся хвостом - при закрытии цена положительная,
        это дебет.
      - Дальше заявку не веди, её доводит харнесс. Скажи одной строкой: что закрыл,
        по какой цене открывал, какой лимит поставил, капитал и собранный кредит.

  - name: probe-expiry
    cause: "проба истечения: увидеть истечение сегодня, а не ждать завтрашнего утра"
    at: "12:50"
    within: 25m
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверяем путь, которого мы ещё не видели: что происходит с конструкцией в
      день её истечения. Поэтому здесь - и только здесь - берём СЕГОДНЯШНЮЮ
      экспирацию, хотя дельт по ней брокер не считает.
      - Бумага: SPY. Экспирация: сегодняшняя.
      - Страйк выбирай по расстоянию от цены, а не по дельте: проданная нога
        примерно на 0,4-0,6% ниже текущей цены SPY, купленная - на страйк ниже.
      - Один контракт. Обе ноги должны иметь двустороннюю котировку.
      - Запиши намерение, в тезисе прямо напиши, что это проверка истечения.
      - Отправь одной mleg-заявкой лимитом по середине, в client_order_id укажи
        худшую цену с неповторяющимся хвостом.
      - Скажи одной строкой: что открыл, какой кредит, капитал, собранный кредит.

  - name: probe-condor
    cause: "проба четырёхногой конструкции: движок crush собирается торговать именно её"
    at: "13:05"
    within: 25m
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверяем механику конструкции из четырёх ног одной заявкой - её мы не
      отправляли ни разу, а движок под отчёт AVGO собирается торговать именно такую.
      - Бумага: SPY, экспирация завтрашняя.
      - Конструкция: железный кондор из четырёх ног ОДНОЙ mleg-заявкой: продать put
        около дельты -0,15 и купить put на страйк ниже; продать call около дельты
        +0,15 и купить call на страйк выше.
      - Один контракт. Все четыре ноги с двусторонней котировкой.
      - Запиши намерение, в тезисе напиши, что это проверка четырёхногой заявки.
      - Отправь ОДНОЙ заявкой лимитом по середине, худшую цену укажи в client_order_id.
      - Скажи одной строкой: приняли или отказали и что именно ответил брокер. Отказ
        здесь тоже результат - тогда назови его дословно и не повторяй заявку.

  - name: probe-tools
    cause: "проба инструментов Alpaca, которыми мы ещё не пользовались"
    at: "13:20"
    within: 30m
    days: [mon, tue, wed, thu, fri]
    task: |
      Заявок не отправляй. Задача - посмотреть, что отдают инструменты Alpaca,
      которыми мы ещё ни разу не пользовались, и записать это себе в заметки.
      Вызови по одному разу и назови одной строкой на каждый, что пришло и годится
      ли это нам: движения рынка за день (market movers), самые активные бумаги,
      история капитала счёта (portfolio history), корпоративные события по SPY, QQQ,
      IWM на ближайший месяц, и поиск по документации API, если такой инструмент есть.
      Если инструмента нет в списке - так и скажи, не выдумывай.

  - name: probe-refusal
    cause: "проба отказа: как выглядит отказ брокера и умеем ли мы его не повторять"
    at: "12:45"
    within: 30m
    days: [mon, tue, wed, thu, fri]
    task: |
      Это намеренная проверка отказа, а не торговля. Нам нужно увидеть, как выглядит
      отказ брокера и что попадает в запись.
      Отправь заведомо непроходимую заявку: тот же put-спред, что и обычно, но
      количеством 10000 контрактов - покупательной способности на это заведомо нет.
      Запиши намерение до заявки и напиши в тезисе, что это проверка отказа.
      Получив отказ, НЕ повторяй его и не уменьшай размер: назови дословно, что
      ответил брокер, и закончи. Смысл пробы - увидеть ответ, а не войти.

  - name: convexity
    cause: "слой выпуклости: дешёвая ставка на сильное движение, ограниченная и известная"
    every: 2h
    between: ["09:50", "15:00"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Этот слой существует ради дня, когда рынок пойдёт сильно - именно в такой день
      проданная нами премия проигрывает вся сразу. Поэтому здесь мы не продаём, а
      покупаем движение, но так, чтобы это почти ничего не стоило.
      - Конструкция: backspread. Продать ОДИН опцион ближе к деньгам и купить ДВА
        того же типа и той же экспирации дальше от денег. Всё одной mleg-заявкой.
      - Сторона: put-backspread, если хочешь застраховать наши проданные put-спреды;
        call-backspread, если открыты в основном call-спреды. Смотри, чего у нас
        больше, и страхуй именно это.
      - Бумаги: SPY или QQQ - там самые узкие спреды bid-ask.
      - Экспирация: от двух до пяти торговых дней, чтобы у движения было время.
      - Цена: вход должен быть около нуля или в кредит. Потолок - 3% капитала:
        дороже не бери вовсе и скажи, сколько просили. Расход - это цена билета,
        и она сгорает, если рынок простоит; поэтому за неё не переплачивают.
      - Стоимость прохода считай ДО решения и по всем трём ногам: у этой
        конструкции их три, значит проход дороже, чем у вертикали, и именно он
        превращает «вход около нуля» в ежедневный расход. Дороже пятой части
        полученного кредита - не бери.
      - Уже есть открытая такая конструкция на ту же бумагу и ту же экспирацию -
        не удваивай, возьми другую бумагу или скажи, что места нет. Если конструкцию отдают
        около нуля, бери столько контрактов, сколько влезает в этот потолок, а не
        один: слой существует ради выплаты в день сильного движения, и один
        контракт такой выплаты не даёт.
      - Проданная нога должна быть покрыта купленными по количеству: продаём одну,
        покупаем две, иначе это голый риск.
      - Запиши намерение (record_intent): в тезисе напиши, что это слой выпуклости
        и что он страхует.
      - Одной строкой: что взял, за сколько, каков максимальный убыток, капитал.

  - name: probe-assignment
    cause: "проверка исполнения: что делает счёт, когда проданная нога уходит в деньги"
    at: "14:40"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Опыт, а не заработок. Мы ни разу не видели, что происходит со счётом, когда
      проданный опцион доживает до экспирации В ДЕНЬГАХ, и завтра это может
      случиться само - лучше увидеть это на своих условиях и за понятную цену.
      - Возьми SPY или QQQ, экспирация СЕГОДНЯ.
      - Продай put со страйком ВЫШЕ текущей цены (то есть заведомо в деньгах),
        купи put на доллар ниже. Один контракт. Одной mleg-заявкой.
      - "В деньгах" значит: покупатель проданного нами опциона выгадает, если
        исполнит его, поэтому почти наверняка исполнит. Максимальный убыток здесь
        около 100 долларов, и это цена опыта.
      - Запиши намерение (record_intent) и прямо напиши в тезисе, что это проверка
        исполнения, а не сделка ради прибыли.
      - Одной строкой: что взял, за сколько, какая цена SPY сейчас, какой страйк.

  - name: probe-partial
    cause: "проверка частичного исполнения: заявка крупнее, чем стоит в стакане"
    at: "14:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Опыт, а не заработок. До сих пор мы брали по одному-два контракта, и заявка
      всегда исполнялась целиком. Нужно увидеть, что происходит, когда она крупнее
      того, что стоит в стакане: исполнится ли часть, что покажет get_orders, и
      останется ли остаток жить.
      - Возьми SPY или QQQ, экспирация через один-три торговых дня.
      - Обычный put-спред шириной доллар на дистанции около 0,5% от цены,
        но количество - 50 контрактов, одной mleg-заявкой.
      - Цену ставь ту, что стакан показывает сейчас, а не лучше: нам нужно
        исполнение, а не ожидание.
      - Запиши намерение (record_intent) с максимальным убытком на все 50
        контрактов и прямо напиши, что это проверка частичного исполнения.
      - Через минуту после отправки посмотри get_orders и скажи одной строкой:
        сколько контрактов исполнилось, по какой цене, что стало с остатком.

  - name: news-watch
    cause: "проверка новостей по нашим бумагам"
    every: 20m
    between: ["09:35", "15:45"]
    days: [mon, tue, wed, thu, fri]
    # Читает и решает, стоит ли будить того, кто торгует. Дорогая модель здесь не
    # нужна: работа сводится к чтению ленты и одному суждению.
    model: gpt-5.6-luna
    task: |
      Прочитай новости по SPY, QQQ, IWM и по бумагам, в которых у нас открыты позиции.
      Если ничего важного - ответь одной строкой «ничего нового» и закончи.
      Будить торговую сессию дорого, а забыть, кого ты будил час назад, легко:
      каждый твой запуск начинается с чистой памяти. Поэтому решает не новость, а
      цена - её видно всегда и она не зависит от того, что ты помнишь.
      Буди, только когда верны оба: есть открытая позиция по этой бумаге, И цена
      подошла к её проданному страйку ближе чем на треть того расстояния, которое
      было при открытии. Расстояние при открытии считай от цены входа из записи
      (read_state) или из заявки на открытие.
      Мнение чиновника, прогноз, приток или отток средств, объявленные тарифы -
      сами по себе не повод: рынок читает их без нас, они уже в цене, и если цена
      от нашего страйка не сдвинулась, будить некого.
      Если оба верны - поставь пробуждение через пять минут (wake_me_at) с причиной
      вида «проверь открытые позиции против этой новости: <новость>. Ничего нового не
      открывай», и скажи в чат, что именно нашёл.
      Заявок не отправляй: твоя работа - заметить, а не торговать.

  - name: defend
    cause: "проверка правил защиты"
    every: 15m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Заявками на вход не занимайся: их ведёт харнесс - шагает ценой к стакану и
      отменяет то, что стакан не взял.
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Сначала прочитай намерения (read_state). Позицию, чьё намерение прямо говорит,
      что она открыта как ПРОВЕРКА - проверка исполнения, проверка частичного
      исполнения, - не трогай ни при каких условиях и скажи о ней одной строкой.
      Такая позиция открыта ради того, чтобы досидеть до конца и показать, что
      будет; закрыть её значит отменить опыт, ради которого мы заплатили.
      Закрой позицию, если цена базового актива прошла проданный страйк - для put это
      цена ниже страйка, для call выше.
      - **Цена ушла за КУПЛЕННУЮ ногу - не закрывай.** Когда обе ноги в деньгах,
        убыток спреда уже равен ширине и больше не вырастет: он ограничен по
        построению. Закрытие в этот момент не спасает ничего, а платит проход и
        отдаёт последнее, что осталось, - вероятность, что бумага вернётся обратно
        до истечения. Закрывай только когда цена МЕЖДУ проданным и купленным
        страйком: там убыток ещё растёт, и остановить его есть смысл.
        Живой случай 26 августа: META 575/577,5 call при цене 583 - за обеими
        ногами, - и закрытие предлагалось по 2,50 при ширине 2,50, то есть по
        полному убытку плюс проход.

      Больше ничего не закрывай: спред живёт распадом времени, и закрытая раньше
      срока позиция платит спред дважды, а собирает половину. Позиция с завтрашней
      экспирацией ночует - это нормально, риск у неё ограничен шириной конструкции.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть всё перед концом торгового дня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Сначала прочитай намерения (read_state). Позицию, чьё намерение прямо говорит,
      что она открыта как ПРОВЕРКА ИСПОЛНЕНИЯ, оставь как есть: она для того и
      открыта, чтобы дожить до исполнения и показать, что делает счёт. Назови её
      одной строкой и иди дальше.
      Закрой позиции по опционам, истекающим СЕГОДНЯ, у которых проданный страйк
      ближе 50 центов к цене базового актива: именно они рискуют исполнением.
      Остальным сегодняшним дай истечь - выкуп центового спреда стоит дороже, чем он спасает.
      Позиции с более поздней экспирацией не трогай: они открыты вчера или сегодня и
      живут дальше, их риск ограничен шириной конструкции.
      Если позиция не закрылась лимитной заявкой за пять минут, закрывай по рынку:
      исполнение проданного put это 100 акций на каждый контракт до следующего дня.
      Назови результат дня и подтверди по брокеру, что осталось только то, чему дали истечь,
      и позиции с более поздней экспирацией.
