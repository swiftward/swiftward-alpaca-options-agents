# Пробная декларация: ею работает счёт для разработки до кикоффа.
#
# Отличается от сдаваемой (agent.yaml) тремя вещами, и всё три - ради скорости
# обучения, а не ради прибыли: вход пробуется каждые полчаса вместо трёх окон,
# позиция всегда в один контракт, а защита ходит вдвое чаще. На этом счёте
# ошибка стоит ноль, а наблюдение стоит одного хода, поэтому наблюдений нужно
# много. Сдаваемая декларация остаётся какой была.
#
# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha-experiment
version: v1
timezone: America/New_York

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции: часть из них открыта вчера и истекает сегодня.
      Назови деньги, покупательную способность и по каждой позиции - когда она истекает.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry
    cause: "проба входа: смотрим, проходит ли конструкция и что отвечает брокер"
    every: 30m
    between: ["09:45", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Это счёт для разработки и пробный прогон. Ценность хода - в наблюдении, а не
      в прибыли: нам нужно знать, что заявка уходит, чем отвечает брокер и что
      попадает в запись.
      Правило входа целиком, ничего не додумывай:
      - Бумаги: SPY, QQQ, IWM.
      - Экспирация: ближайшая из тех, где брокер считает чувствительности - как правило
        завтрашняя. Сегодняшнюю не трогай: в день истечения дельты нет ни на одном
        потоке, страйк выбрать не по чему.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта около -0,15,
        купленная - на один страйк ниже. Бери самую узкую, где у обеих ног есть
        двусторонняя котировка, а отношение кредита к риску не хуже 10%.
      - Размер: РОВНО один контракт. Здесь мы покупаем наблюдения, а не позицию.
      - Пробуй ВСЕ три бумаги за окно, по одному контракту в каждой, где конструкция
        проходит порог: нам нужны наблюдения по разным инструментам, а не одно.
      - Не открывай вторую позицию в ту же бумагу с той же экспирацией. Всего открытых
        не больше двенадцати.
      - Предохранитель: если капитал ниже вчерашнего закрытия на 3% и больше - на сегодня
        хватит, скажи это одной строкой и закончи.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой лимитом по середине, а в client_order_id заявки
        напиши худшую цену, по которой согласен исполниться, в виде worst=-0.11
        (для кредита цена отрицательная). Ниже этой цены харнесс не пойдёт никогда,
        а до неё доведёт сам: шагает к цене стакана, ждёт на каждой цене, и отменяет,
        если стакан так и не взял. Сам за заявкой не следи.
        Разумная граница - отдать не больше трети полученного кредита.
      - Одной строкой скажи: вошёл или нет, и если нет - какое отношение кредита к риску
        было у лучшей конструкции по каждой бумаге. Это и есть наблюдение.

  - name: entry-call
    cause: "проба другой стороны: продажа call-спреда выше денег"
    every: 30m
    between: ["09:50", "15:15"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Та же проба, но с другой стороны рынка. Эту конструкцию мы ещё ни разу не
      проверяли живой заявкой, а она удваивает кредит по бумаге, не увеличивая
      риск позиции: убыток по каждой стороне ограничен своей шириной, и обе
      стороны одновременно проиграть не могут.
      - Бумаги: SPY, QQQ, IWM. Экспирация - ближайшая с чувствительностями.
      - Конструкция: продажа вертикального call-спреда. Проданная нога - дельта
        около +0,15, купленная - на один страйк ВЫШЕ.
      - Отношение кредита к риску не хуже 10%, обе ноги с двусторонней котировкой.
      - Размер: ровно один контракт. Не больше одной такой позиции на бумагу с одной
        экспирацией.
      - Запиши намерение (record_intent) до заявки и отправь ОДНОЙ заявкой лимитом
        по середине, указав в client_order_id худшую цену в виде worst=-0.11.
      - Одной строкой: вошёл или нет и какое отношение было у лучшей конструкции.

  - name: take-profit
    cause: "проба закрытия: путь закрытия позиции мы ещё не проходили живьём"
    every: 15m
    between: ["09:50", "15:40"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Здесь мы проверяем закрытие, которого ещё ни разу не делали живой заявкой.
      Посмотри открытые позиции по спредам. Если конструкция уже отдала половину
      полученного кредита - закрой её встречной заявкой ОДНОЙ mleg-заявкой
      (купить проданную ногу, продать купленную), лимитом по середине, и укажи в
      client_order_id худшую цену в виде worst=0.09 (для закрытия цена
      положительная - это дебет).
      Если таких позиций нет, скажи одной строкой, сколько каждая отдала, и закончи.
      Заявку дальше не веди: её доводит харнесс.

  - name: probe-refusal
    cause: "проба отказа: как выглядит отказ брокера и умеем ли мы его не повторять"
    at: "12:45"
    within: 30m
    days: [mon, tue, wed, thu, fri]
    task: |
      Это намеренная проверка отказа, а не торговля. Нам нужно увидеть, как выглядит
      отказ брокера и что попадает в запись.
      Отправь заведомо непроходимую заявку: тот же put-спред, что и обычно, но
      количеством 10000 контрактов - покупательной способности на это заведомо нет.
      Запиши намерение до заявки и напиши в тезисе, что это проверка отказа.
      Получив отказ, НЕ повторяй его и не уменьшай размер: назови дословно, что
      ответил брокер, и закончи. Смысл пробы - увидеть ответ, а не войти.

  - name: news-watch
    cause: "проверка новостей по нашим бумагам"
    every: 30m
    between: ["09:35", "15:45"]
    days: [mon, tue, wed, thu, fri]
    # Читает и решает, стоит ли будить того, кто торгует. Дорогая модель здесь не
    # нужна: работа сводится к чтению ленты и одному суждению.
    model: gpt-5.6-luna
    task: |
      Прочитай новости по SPY, QQQ, IWM и по бумагам, в которых у нас открыты позиции.
      Если ничего важного - ответь одной строкой «ничего нового» и закончи.
      Если появилась новость, которая может двинуть нашу позицию сегодня,
      поставь себе пробуждение через пять минут (wake_me_at) с причиной вида
      «проверь открытые позиции против этой новости: <новость>. Ничего нового не открывай»,
      и скажи в чат, что именно нашёл.
      Заявок не отправляй: твоя работа - заметить, а не торговать.

  - name: defend
    cause: "проверка правил защиты"
    every: 15m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Заявками на вход не занимайся: их ведёт харнесс - шагает ценой к стакану и
      отменяет то, что стакан не взял.
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Закрой позицию, если цена базового актива прошла проданный страйк - для put это
      цена ниже страйка, для call выше.
      Больше ничего не закрывай: спред живёт распадом времени, и закрытая раньше
      срока позиция платит спред дважды, а собирает половину. Позиция с завтрашней
      экспирацией ночует - это нормально, риск у неё ограничен шириной конструкции.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть всё перед концом торгового дня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой позиции по опционам, истекающим СЕГОДНЯ, у которых проданный страйк
      ближе 50 центов к цене базового актива: именно они рискуют исполнением.
      Остальным сегодняшним дай истечь - выкуп центового спреда стоит дороже, чем он спасает.
      Позиции с более поздней экспирацией не трогай: они открыты вчера или сегодня и
      живут дальше, их риск ограничен шириной конструкции.
      Если позиция не закрылась лимитной заявкой за пять минут, закрывай по рынку:
      исполнение проданного put это 100 акций на каждый контракт до следующего дня.
      Назови результат дня и подтверди по брокеру, что осталось только то, чему дали истечь,
      и позиции с более поздней экспирацией.
