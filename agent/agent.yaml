# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha
version: v1
timezone: America/New_York

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции, назови деньги и покупательную способность.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry-midday
    cause: "дневное окно входа: позиция живёт полсессии"
    at: "12:30"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      Дневное окно входа.
      Правило входа целиком, ничего не додумывай:
      - Бумаги: SPY, QQQ, IWM. Экспирация - сегодняшняя.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта около -0,15,
        купленная - на один-два страйка ниже. Бери самую узкую, где у обеих ног есть
        двусторонняя котировка, а отношение полученного кредита к риску не хуже 15%.
      - Размер: максимальный убыток позиции не больше 0,5% капитала. Капитал прочитай у
        брокера, не подставляй число из головы. Число контрактов - целое вниз.
      - Сколько входов: не больше двух в одну бумагу за день и не больше шести за день всего.
        В бумагу, позицию по которой сегодня уже закрыла защита, сегодня не возвращайся.
      - Дневной предохранитель: прочитай счёт. Если капитал ниже вчерашнего закрытия
        на 2% и больше - сегодня не открывай ничего и скажи об этом одной строкой.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой, лимитом по середине. Цену не догоняй.
        Если через десять минут заявка не исполнилась - отмени её.
      - Скажи, что сделал и что ответил брокер.

  - name: entry-morning
    cause: "утреннее окно входа, берётся только когда премия дорога"
    at: "10:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      Утренний вход берётся не всегда: впереди целый день движения, поэтому премия
      должна быть дорогой по той мерке, которую ты видишь прямо в цепочке.
      Заходи только в ту бумагу, где отношение кредита к риску лучшей конструкции
      не хуже 20%, и не больше чем в одну бумагу за это окно.
      Если ни одна не прошла - скажи одной строкой, какое отношение у каждой, и закончи.

      Правило входа целиком, ничего не додумывай:
      - Бумаги: SPY, QQQ, IWM. Экспирация - сегодняшняя.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта около -0,15,
        купленная - на один-два страйка ниже. Бери самую узкую, где у обеих ног есть
        двусторонняя котировка, а отношение полученного кредита к риску не хуже 15%.
      - Размер: максимальный убыток позиции не больше 0,5% капитала. Капитал прочитай у
        брокера, не подставляй число из головы. Число контрактов - целое вниз.
      - Сколько входов: не больше двух в одну бумагу за день и не больше шести за день всего.
        В бумагу, позицию по которой сегодня уже закрыла защита, сегодня не возвращайся.
      - Дневной предохранитель: прочитай счёт. Если капитал ниже вчерашнего закрытия
        на 2% и больше - сегодня не открывай ничего и скажи об этом одной строкой.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой, лимитом по середине. Цену не догоняй.
        Если через десять минут заявка не исполнилась - отмени её.
      - Скажи, что сделал и что ответил брокер.

  - name: entry
    cause: "окно входа во второй половине сессии"
    at: "14:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      Главное окно входа дня.
      Правило входа целиком, ничего не додумывай:
      - Бумаги: SPY, QQQ, IWM. Экспирация - сегодняшняя.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта около -0,15,
        купленная - на один-два страйка ниже. Бери самую узкую, где у обеих ног есть
        двусторонняя котировка, а отношение полученного кредита к риску не хуже 15%.
      - Размер: максимальный убыток позиции не больше 0,5% капитала. Капитал прочитай у
        брокера, не подставляй число из головы. Число контрактов - целое вниз.
      - Сколько входов: не больше двух в одну бумагу за день и не больше шести за день всего.
        В бумагу, позицию по которой сегодня уже закрыла защита, сегодня не возвращайся.
      - Дневной предохранитель: прочитай счёт. Если капитал ниже вчерашнего закрытия
        на 2% и больше - сегодня не открывай ничего и скажи об этом одной строкой.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой, лимитом по середине. Цену не догоняй.
        Если через десять минут заявка не исполнилась - отмени её.
      - Скажи, что сделал и что ответил брокер.

  - name: news-watch
    cause: "проверка новостей по нашим бумагам"
    every: 30m
    between: ["09:35", "15:45"]
    days: [mon, tue, wed, thu, fri]
    # Читает и решает, стоит ли будить того, кто торгует. Дорогая модель здесь не
    # нужна: работа сводится к чтению ленты и одному суждению.
    model: gpt-5.6-luna
    task: |
      Прочитай новости по SPY, QQQ, IWM и по бумагам, в которых у нас открыты позиции.
      Если ничего важного - ответь одной строкой «ничего нового» и закончи.
      Если появилась новость, которая может двинуть нашу позицию сегодня,
      поставь себе пробуждение через пять минут (wake_me_at) с причиной вида
      «проверь открытые позиции против этой новости: <новость>. Ничего нового не открывай»,
      и скажи в чат, что именно нашёл.
      Заявок не отправляй: твоя работа - заметить, а не торговать.

  - name: defend
    cause: "проверка правил защиты"
    every: 30m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Закрой позицию, если цена базового актива прошла проданный страйк.
      Больше ничего не закрывай: однодневный спред живёт распадом времени, и
      закрытая раньше срока позиция платит спред дважды, а собирает половину.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть всё перед концом торгового дня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой позиции по опционам, истекающим сегодня, у которых проданный страйк
      ближе 50 центов к цене базового актива: именно они рискуют исполнением.
      Остальным дай истечь - выкуп центового спреда стоит дороже, чем он спасает.
      Если позиция не закрылась лимитной заявкой за пять минут, закрывай по рынку:
      исполнение проданного put это 100 акций на каждый контракт до понедельника.
      Назови результат дня и подтверди по брокеру, что осталось только то, чему дали истечь.
