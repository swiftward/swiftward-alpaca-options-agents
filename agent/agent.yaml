# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha
version: v1
timezone: America/New_York

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции, назови деньги и покупательную способность.
      Посмотри ленту новостей по бумагам, в которых у нас позиции.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry-midday
    cause: "дневное окно входа: позиция живёт полсессии"
    at: "12:30"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      Дневной вход по тому же правилу, что и entry, с одним отличием: заходи только
      в ту бумагу, где сейчас нет нашей позиции с сегодняшней экспирацией.
      Если во всех трёх бумагах позиция уже есть - скажи это одной строкой и закончи.

  - name: entry-morning
    cause: "утреннее окно входа, берётся только когда премия дорога"
    at: "10:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      Утренний вход берётся не всегда: движение впереди целого дня, поэтому
      премия должна быть дорогой по собственной мерке.
      Спроси read_volatility_history по каждой бумаге из SPY, QQQ, IWM.
      Если по бумаге меньше 50 замеров - истории ещё нет, эту бумагу утром пропусти.
      Заходи только там, где ранг 60 и выше, и не больше чем в одну бумагу за это окно.
      Дальше - обычное правило входа (ниже, в сессии entry), с тем же ограничением убытка.
      Если ни одна бумага не прошла - скажи одной строкой, какой у каждой ранг, и закончи.

  - name: entry
    cause: "окно входа во второй половине сессии"
    at: "14:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      Правило входа: продажа вертикального put-спреда с истечением сегодня.
      Бумаги: SPY, QQQ, IWM - у всех дневные экспирации и узкий спред.
      Проданная нога - дельта около -0,15; купленная - на один-два страйка ниже.
      Бери самую узкую конструкцию, у которой обе ноги имеют двустороннюю котировку,
      а спред между bid и ask узкий: почти вся премия живёт в первом долларе ширины.
      Максимальный убыток позиции - не больше 0,5% капитала; не больше одной позиции
      на бумагу с одной и той же экспирацией и не больше восьми открытых сразу.
      Заходи в те бумаги, где конструкция проходит пороги; если проходит только одна - бери одну.
      Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      Отправь спред ОДНОЙ заявкой, лимитом по середине; если не исполнилось - не догоняй цену.
      Скажи, что сделал и что ответил брокер.

  - name: news-watch
    cause: "проверка новостей по нашим бумагам"
    every: 30m
    between: ["09:35", "15:45"]
    # Читает и решает, стоит ли будить того, кто торгует. Дорогая модель здесь не
    # нужна: работа сводится к чтению ленты и одному суждению.
    model: gpt-5.6-luna
    task: |
      Прочитай новости по SPY, QQQ, IWM и по бумагам, в которых у нас открыты позиции.
      Если ничего важного - ответь одной строкой «ничего нового» и закончи.
      Если появилась новость, которая может двинуть нашу позицию сегодня,
      поставь себе пробуждение через пять минут (wake_me_at) с причиной,
      в которой перескажешь новость, и скажи в чат, что именно нашёл.
      Заявок не отправляй: твоя работа - заметить, а не торговать.

  - name: defend
    cause: "проверка правил защиты"
    every: 30m
    between: ["09:40", "15:55"]
    task: |
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Закрой позицию, если убыток дошёл до двух полученных премий,
      если цена прошла проданный страйк,
      или если до истечения осталось меньше двух часов.
      Закрой и тогда, когда позиция уже отдала 60% максимальной прибыли: остаток
      премии не стоит риска, а освободившееся место можно занять в следующее окно.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть всё перед концом торгового дня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой все открытые позиции по опционам, истекающим сегодня.
      Подтверди по брокеру, что позиций не осталось, и назови результат дня.
