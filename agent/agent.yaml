# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha
version: v1
timezone: America/New_York

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции: часть из них открыта вчера и истекает сегодня.
      Назови деньги, покупательную способность и по каждой позиции - когда она истекает.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry-midday
    cause: "дневное окно входа: позиция живёт полсессии"
    at: "12:30"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      Дневное окно входа.
      Правило входа целиком, ничего не додумывай:
      - Бумаги: SPY, QQQ, IWM, AAPL, TSLA, META, MSFT, GOOGL, AMZN, NVDA, AMD, AVGO,
        NFLX, COIN, MU, PLTR, XLF, XLE, SMH, TLT. Смотри их по очереди и бери те,
        что проходят пороги. У акций страйки шире, поэтому риск на контракт больше,
        и число контрактов считается от него, а не от привычки.
      - Экспирация: любая из тех, где брокер считает чувствительности, но не дальше
        пяти торговых дней. Сегодняшнюю не трогай: в день истечения дельт нет ни на
        одном потоке, страйк выбрать не по чему. Ближняя экспирация распадается
        быстрее, дальняя чаще проходит пороги - бери ту, что проходит.
      - Конструкция: продажа вертикального put-спреда. Проданная нога - дельта около -0,15,
        купленная - на один страйк ниже. Бери самую узкую, где у обеих ног есть
        двусторонняя котировка, а отношение полученного кредита к риску не хуже 10%.
      - Стоимость входа и выхода считается ДО решения: сложи спред bid-ask обеих ног.
        Если он больше трети полученного кредита - конструкция не годится, какой бы
        красивой ни выглядела доля кредита к риску. Замерено 25 августа: у DIA доля
        20,5% при стоимости прохода 0,13 против кредита 0,085 - то есть минус.
        Замерено 25 августа в середине дня: на завтрашней экспирации это 10-17%.
      - Размер: максимальный убыток позиции не больше 0,5% капитала. Капитал прочитай у
        брокера, не подставляй число из головы. Число контрактов - целое вниз.
      - Предел держится по РИСКУ: сумма максимальных убытков всех открытых конструкций
        не выше объявленной доли капитала. Число позиций само по себе пределом не
        является - десять мелких позиций это недобор, а не полный портфель.
      - Сколько входов: не больше четырёх в одну бумагу за день (по две на сторону) и не
        больше двенадцати за день всего. В бумагу, позицию по которой сегодня закрыла
        ЗАЩИТА (цена прошла страйк), сегодня не возвращайся; закрытие по прибыли
        возврату не мешает - это и есть повторный вход.
      - Дневной предохранитель: прочитай счёт. Если капитал ниже вчерашнего закрытия
        на 2% и больше - сегодня не открывай ничего и скажи об этом одной строкой.
      - Спроси read_volatility_history по этой бумаге и напиши полученный ранг в тезисе
        намерения. Если замеров меньше пятидесяти - так и напиши, что истории ещё нет.
        Ранг сейчас ни на что не влияет и ничего не запрещает: мы копим данные, чтобы
        через неделю проверить на своих же сделках, отличается ли результат входов при
        высоком ранге от входов при низком. Практики называют это главным улучшением
        2025 года, а рецензируемого подтверждения у него нет - вот и проверим сами.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция, максимальный убыток.
      - Отправь спред ОДНОЙ заявкой лимитом по середине, а в client_order_id заявки
        напиши худшую цену, по которой согласен исполниться, в виде worst=-0.11
        (для кредита цена отрицательная), и через точку с запятой что-нибудь
        неповторяющееся - брокер отказывает, если такое имя он уже видел
        (client_order_id must be unique). Например worst=-0.11;QQQ703-702-1226. Ниже этой цены харнесс не пойдёт никогда,
        а до неё доведёт сам: шагает к цене стакана, ждёт на каждой цене, и отменяет,
        если стакан так и не взял. Сам за заявкой не следи.
        Разумная граница - отдать не больше трети полученного кредита.
      - Скажи, что сделал и что ответил брокер.
      - В той же строке, где говоришь результат, назови два числа со счёта: капитал
        сейчас и сколько кредита держат открытые позиции. Отдельным ходом об этом
        не отчитывайся - он стоит дороже, чем сообщает.

