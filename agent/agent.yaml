# When the agent wakes and why. Hours are New York's, because the market is.
#
# Nothing here says what to trade: each session carries a task in words, and the
# session that reads it decides. That line is what makes the agent autonomous
# rather than driven.
kind: trading-agent
name: options-alpha
version: v1
timezone: America/New_York

# Какие приёмы этот агент вообще получает. Имя - то, что стоит в шапке SKILL.md.
# Уровень агента, а не сессии: агент читает каталог приёмов один раз, когда
# запускается, и один процесс обслуживает все сессии, так что сузить набор под
# отдельное окно нечем. Какой приём взять, по-прежнему говорит задача словами.
# Набор сужают потому, что описание каждого приёма уходит в промпт КАЖДОГО хода.
skills:
  - playbook-premium-harvest
  - playbook-convexity
  - playbook-earnings-crush
  - playbook-event-convexity
  - read-my-envelope

# Числа, с которыми этот агент выполняет свои приёмы. Приём держит механику и
# ПРИМЕР числа; число, которое действительно применяется, живёт здесь - два счёта
# гоняют один и тот же приём нарочно, и разница между ними и есть весь опыт.
# Скил объявляет в шапке (`requires:`), какие числа ему нужны; не дали - агент не
# стартует и говорит, какого не хватает.
# Они встают в начало КАЖДОГО хода - неважно, разбудило ли окно, собственное
# пробуждение сессии или человек в чате, - поэтому в тексте окон их повторять не
# надо; окну, которому нужно другое число, достаточно сказать это у себя.
parameters:
  # ПОСЧИТАНО: research/grid.py, 27 августа. SPY и QQQ, 646 торговых дней с
  # 18 января 2024, 289 459 структур. Дельта в истории восстановлена обратной
  # задачей и сверена дважды: с нашей же базой (средняя ошибка 0,0082 при шаге
  # сетки 0,05) и паритетом пут-колл на 9312 парах страйков.
  #
  # 0,45 стоял здесь с утра 27 августа по ОДНОМУ проходу: в полосе 0,25-0,45
  # кредит к риску 40,9% против 14,3% под ней. Больше кредита там и правда есть,
  # и пропорционально больше проигрышей - на истории 0,45 хуже везде. Замер
  # одного среза уступил замеру двух с половиной лет.
  short_leg_delta: "не больше 0,30 по модулю"
  # ПОСЧИТАНО тем же прогоном, и это число решает больше, чем потолок дельты.
  # Ожидание монотонно растёт с порогом при любом потолке, а ЗНАК меняется между
  # 0 и +1: при -1,0 ожидание -0,72 доллара на сделку, при +2 уже +2,63, при +3
  # +4,14. То есть до сегодня правило было убыточным по устройству, а не по
  # невезению.
  #
  # Берём +2, а не +3, как единицу запаса от точки смены знака: склон плавный,
  # пика нет, и каждый лишний пункт стоит примерно трети сделок.
  #
  # ПОРОГ и ВЫБОР - разные вещи. «Наибольшее в списке» сессии читали как планку,
  # равную лучшему кандидату, а такая планка непроходима: ноги перечитываются
  # перед заявкой, список к этому моменту постарел, и лучший падает ниже себя.
  # Порог применяется к СВЕЖИМ котировкам, выбор - внутри допустимого.
  min_edge_points: "не ниже +2 по свежим котировкам; внутри допустимого брать наибольшее"
  # ВРЕМЕННО: не мерялось ни разу. Занятая волатильность бывает только в день
  # истечения, а бэктест 27 августа показал, что нулевая экспирация мерой
  # преимущества и так не проходит - значит и повода мерить пока не было.
  min_edge_points_borrowed: "строго больше 0: занятая волатильность завышает преимущество"
  # Предохранитель дня. Числа своего у этой декларации не было, и она работала на
  # 2% из скила - это оно и есть, перенесённое туда, где его видно.
  # ВРЕМЕННО: перенесено из скила, где стояло без обоснования. Считается по
  # распределению дневных просадок счёта, а их у нас пока два дня.
  daily_fuse_percent: "2"

  # Слой выпуклости. Размер меряется ХУДШИМ ИСХОДОМ - долиной backspread'а на
  # купленном страйке при истечении. Потолок, посчитанный от цены входа, не
  # ограничивает ничего: при двух центах за набор он разрешает сотни наборов.
  # Это уже случилось однажды, и написал это в декларацию не человек, а агент.
  # ВРЕМЕННО: назначено. Считается тем же способом, что и доля ставки на событие -
  # по распределению исходов конструкции на истории. Слой ещё не мерялся.
  convexity_worst_case_share: "одна конструкция - не больше 2% капитала по худшему исходу"
  # ВРЕМЕННО: назначено.
  convexity_layer_share: "весь слой вместе с уже открытым - не больше 3% капитала"
  # ВРЕМЕННО: назначено.
  convexity_daily_debit: "не больше 0,5% капитала за день"
  # Делится на ШИРИНУ, а не на кредит: кредита тут около нуля, и деление на него
  # запретило бы всё подряд.
  # ВРЕМЕННО: назначено. Живой замер книги 27 августа дал медиану 0,07 доллара на
  # спред из двух ног; для трёхногой конструкции такого замера нет.
  convexity_roundtrip_share: "не дороже десятой части ширины конструкции"
  # ВРЕМЕННО: назначено.
  convexity_take: "втрое от уплаченного и выше - закрывать"
  # Последний день, чей результат считают. Не «конец недели»: правило про пятницу
  # 27 августа закрыло конструкцию через час после открытия и вдобавок запрещало
  # слою открываться в любой четверг вовсе - все разрешённые экспирации пятницу
  # переживают.
  # ИЗ ПРАВИЛ: приём работ закрывается 4 сентября в 15:00 UTC, результат считают на
  # этот момент, а сделанное после не считают. Мерить тут нечего - это дата.
  convexity_horizon: "4 сентября 2026: то, что истекает позже, слою не годится"

  # Схлопывание на отчёте. Размер мал нарочно: правый хвост тут закрыт крыльями,
  # то есть сделка умеет не проиграть, а не выиграть гонку.
  # ВРЕМЕННО: назначено.
  crush_worst_case_share: "не больше 3% капитала"
  # ВРЕМЕННО: назначено из общих соображений. Считается на прошлых отчётах -
  # подразумеваемое движение против реализованного, и при каком отношении продажа
  # окупалась. Расчёт не сделан.
  crush_implied_over_realized: "продавать при 1,3 и выше; при 0,8 и ниже покупать движение вместо продажи; между - не брать ничего"

  # Ставка на событие - единственная с незакрытым правым хвостом.
  # Пять процентов - значение по умолчанию, и оно НЕ есть решение о размере:
  # двадцать берутся только прямым словом человека вечером накануне.
  # ПОСЧИТАНО: research/gap_bet_analyze.py, 27 августа, 25 отчётов с февраля 2024.
  # Медиана исхода -32,6% от вложенного, в прибыли 7 раз из 25. Пять процентов
  # против двадцати на прожитой истории: $90 423 против $61 083, худшая просадка
  # $86 258 против $53 594. Двадцать - ставка на то, что 25 наблюдений описывают
  # хвост; они его не описывают.
  event_bet_share: "5% капитала; 20% - только по прямому указанию человека, и оно стоит 29 тысяч по истории"
  # ПОСЧИТАНО тем же прогоном: выход в 9:35 даёт среднее -7,4%, выход в 10:00
  # даёт +2,0%. Спешка стоит девять процентных пунктов, поэтому «закрывай сразу»
  # заменено на «не раньше 10:00».
  event_exit_by: "не раньше 10:00 и не позже 10:30 по Нью-Йорку"

sessions:
  - name: open-check
    cause: "рынок открылся полчаса назад, смотрим, с чем работаем"
    at: "10:00"
    within: 2h
    days: [mon, tue, wed, thu, fri]
    task: |
      Проверь часы рынка. Если он закрыт - скажи это и закончи.
      Посмотри счёт и открытые позиции: часть из них открыта вчера и истекает сегодня.
      Назови деньги, покупательную способность и по каждой позиции - когда она истекает.
      Посмотри ленту новостей по SPY, QQQ, IWM.
      Одним сообщением: что открыто, что изменилось за ночь, на что смотреть сегодня.
      Заявок в этой сессии не отправляй.

  - name: entry-midday
    cause: "дневное окно входа: позиция живёт полсессии"
    at: "12:30"
    within: 40m
    days: [mon, tue, wed, thu, fri]
    task: |
      **Это окно работает КАЖДЫЙ торговый день. Исключение ровно одно: 4 сентября
      2026.** Спроси часы и сверь дату:
      - сегодня НЕ 4 сентября 2026 - работай дальше по этому окну, как обычно;
      - сегодня 4 сентября 2026 - ничего не открывай, скажи это одной строкой и
        закончи: в 11:00 по Нью-Йорку закрывается приём работ, результат считают
        на этот момент, а сделанное после не считают вовсе.
      Другого прочтения тут нет: несовпадение даты - НЕ повод закончить.
      Дневное окно входа. Выполни premium-harvest.
      Правило целиком лежит в скиле и здесь не повторяется. Свои пределы - сколько
      можно потерять на позиции и на портфеле, какие бумаги и какие экспирации -
      спроси конвертом (read_envelope). В этом тексте их нет и не будет.

  - name: entry-morning
    cause: "утреннее окно входа, берётся только когда премия дорога"
    at: "10:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      **Это окно работает КАЖДЫЙ торговый день. Исключение ровно одно: 4 сентября
      2026.** Спроси часы и сверь дату:
      - сегодня НЕ 4 сентября 2026 - работай дальше по этому окну, как обычно;
      - сегодня 4 сентября 2026 - ничего не открывай, скажи это одной строкой и
        закончи: в 11:00 по Нью-Йорку закрывается приём работ, результат считают
        на этот момент, а сделанное после не считают вовсе.
      Другого прочтения тут нет: несовпадение даты - НЕ повод закончить.
      Утренний вход берётся не всегда: впереди целый день движения, поэтому премия
      должна быть дорогой по той мерке, которую видно прямо в цепочке.
      Выполни premium-harvest с двумя ужесточениями, и оба - в нашу пользу:
      заходи только в ту бумагу, где отношение кредита к риску лучшей конструкции
      не хуже 13%, и не больше чем в одну бумагу за это окно.
      Если ни одна не прошла - скажи одной строкой, какое отношение у каждой, и закончи.

  - name: entry
    cause: "окно входа во второй половине сессии"
    at: "14:20"
    within: 45m
    days: [mon, tue, wed, thu, fri]
    task: |
      **Это окно работает КАЖДЫЙ торговый день. Исключение ровно одно: 4 сентября
      2026.** Спроси часы и сверь дату:
      - сегодня НЕ 4 сентября 2026 - работай дальше по этому окну, как обычно;
      - сегодня 4 сентября 2026 - ничего не открывай, скажи это одной строкой и
        закончи: в 11:00 по Нью-Йорку закрывается приём работ, результат считают
        на этот момент, а сделанное после не считают вовсе.
      Другого прочтения тут нет: несовпадение даты - НЕ повод закончить.
      Главное окно входа дня. Выполни premium-harvest.

  - name: convexity
    cause: "слой выпуклости: дешёвая ставка на сильное движение, ограниченная и известная"
    every: 2h
    between: ["09:50", "15:00"]
    days: [mon, tue, wed, thu, fri]
    task: |
      **Этот слой работает КАЖДЫЙ торговый день. Исключение ровно одно:
      4 сентября 2026.** Спроси часы и сверь дату:
      - сегодня НЕ 4 сентября 2026 - работай дальше, как обычно, целиком;
      - сегодня 4 сентября 2026 - выполни в скиле ТОЛЬКО раздел про уже открытое,
        а нового не бери. В 11:00 закрывается приём работ, но это же и утро, ради
        которого слой покупался: выходит число по занятости, и если конструкция
        дошла до своей меры, её надо продать, а не оставить до общего закрытия.
      Другого прочтения тут нет: несовпадение даты - НЕ повод закончить.
      Выполни convexity. Правило целиком лежит в скиле и здесь не повторяется.
      Свои пределы спроси конвертом (read_envelope): в этом тексте их нет.
      Держи в голове порядок: сперва разберись с тем, что слой уже держит, и только
      потом думай о новом. Иначе выпуклость покупается и не продаётся никогда.

  - name: earnings-crush
    cause: "отчёт AVGO вечером: продаём то, что вздула неизвестность"
    at: "15:20"
    within: 30m
    days: [wed]
    task: |
      **Сначала проверь дату.** Эта сессия написана под отчёт AVGO 2 сентября 2026.
      Спроси часы (get_clock). Сегодня не 2 сентября - скажи одной строкой и
      закончи, ничего не делая: день недели попал, дата нет.
      Дальше выполни earnings-crush по бумаге AVGO.
      Отчёт выходит после закрытия, поэтому экспирацию бери СЛЕДУЮЩУЮ за ним - та,
      что истекает сегодня, умрёт до реакции и события не несёт вовсе.
      Замер решает сторону, а не мнение: посчитай подразумеваемое движение и медиану
      того, что бумага делала на прошлых отчётах, и скажи оба числа вслух.

  - name: earnings-crush-exit
    cause: "отчёт вышел вчера вечером: схлопывание случилось на открытии, дальше только снос"
    at: "09:35"
    within: 30m
    days: [thu]
    task: |
      **Сначала проверь дату.** Эта сессия написана под утро 3 сентября 2026 -
      наутро после отчёта AVGO. Спроси часы. Сегодня не 3 сентября - скажи одной
      строкой и закончи. Позиции слоя отчётов нет - тоже скажи и закончи.
      **Закрой то, что этот слой держит, чем бы оно ни было.** Замер накануне мог
      отправить в любую из двух сторон: обычно это проданный железный кондор, но
      при перевёрнутом отношении это купленный бэкспред. Обе выходят этим утром.
      Кондор - одной встречной mleg-заявкой, всеми четырьмя ногами.
      Бэкспред слоя отчётов не путай со слоем выпуклости: тот живёт днями, этот
      куплен под один отчёт, отчёт уже был, и волатильность под ним падает весь
      день.
      Схлопывание происходит на открытии; всё, что после - снос, а держать снос эта
      конструкция не нанималась. Последнего цента распада не жди.
      Цена прошла проданный страйк - закрывай всё равно и скажи, сколько это стоило:
      конструкция сделала свою работу тем, что ограничила убыток, а держать её ради
      возврата значит начать другую сделку, которой никто не решал.
      Проверь у брокера, что позиции больше нет, и назови цену, которую получил.

  - name: event-convexity-enter
    cause: "число по занятости выходит утром: покупаем гэп с вечера"
    at: "15:30"
    within: 25m
    days: [thu]
    task: |
      **Сначала проверь дату.** Эта сессия написана под отчёт по занятости
      4 сентября 2026, а вход берётся накануне вечером - 3 сентября.
      Спроси часы. Сегодня не 3 сентября - скажи одной строкой и закончи.
      Дальше выполни event-convexity по SPY, экспирация 4 сентября.
      Это самая крупная ставка недели и единственная, у которой правый хвост не
      закрыт. Она чаще сгорает, чем платит, и это выбранная форма, а не изъян.
      Размер сверх умолчания бери только по прямому слову человека.

  - name: event-convexity-exit
    cause: "число вышло: продаём гэп в первый час"
    at: "09:35"
    within: 55m
    days: [fri]
    task: |
      **Сначала проверь дату.** Эта сессия написана под утро 4 сентября 2026.
      Спроси часы. Сегодня не 4 сентября - скажи одной строкой и закончи.
      Если позиции слоя событий нет - тоже скажи и закончи.
      Дальше выход по правилу из event-convexity, и он не обсуждается:
      гэпа не хватает до безубытка - закрывай сразу, не жди возврата; гэп есть -
      продавай частями по мере движения. Всё закрыто к назначенному часу.
      Стакан в первые минуты широкий: назови цену, которую получил, а не ту,
      которую хотел, и проверь у брокера, что позиции больше нет.

  - name: deadline-flatten
    cause: "приём работ закрывается в 11:00 по Нью-Йорку: к этому часу счёт должен быть плоским"
    at: "10:35"
    within: 20m
    days: [fri]
    task: |
      **Сначала проверь дату.** Эта сессия написана под 4 сентября 2026 - день,
      когда закрывается приём работ. Спроси часы. Сегодня не 4 сентября - скажи
      одной строкой и закончи, ничего не закрывая.
      Дальше. Результат считают по стоимости счёта на 11:00, нереализованное
      ВКЛЮЧАЯ, а сделанное после не считают вовсе.

      **Отмени все работающие заявки - это первое и делается без раздумий.**
      Заявка, исполнившаяся за минуту до отсечки, меняет результат случайным
      образом, и никто этого не решал.

      **Дальше закрывать НЕ всё подряд.** Замерено 27 августа на живой паре
      QQQ 705/706 put, 50 наборов: брокер метил её в −300, а закрыть её прямо
      сейчас стоило −500. То есть закрытие переводит оценку в деньги и платит за
      это проход - двести долларов на одной паре. «Чистый счёт» покупается из тех
      же денег, по которым нас оценивают.

      Поэтому по КАЖДОЙ позиции сравни два числа и назови оба: во сколько её метит
      брокер и что за неё дадут по худшей стороне стакана прямо сейчас.
      - Дают не хуже, чем метит, - закрывай: это бесплатно.
      - Дают заметно хуже - оставляй и скажи, на сколько хуже. Оценка на 11:00
        возьмёт метку, и метка нам выгоднее.
      Ни одного решения без пары чисел рядом с ним.

      Закончи так: сколько закрыл и почему, сколько оставил и на сколько метка была
      выгоднее прохода, деньги и результат. И подтверди У БРОКЕРА, что работающих
      заявок не осталось ни одной - не «отправил отмену», а «брокер показывает
      ноль».

  - name: news-watch
    cause: "проверка новостей по нашим бумагам"
    every: 30m
    between: ["09:35", "15:45"]
    days: [mon, tue, wed, thu, fri]
    # Читает и решает, стоит ли будить того, кто торгует. Дорогая модель здесь не
    # нужна: работа сводится к чтению ленты и одному суждению.
    model: gpt-5.6-luna
    task: |
      Прочитай новости по SPY, QQQ, IWM и по бумагам, в которых у нас открыты позиции.
      Если ничего важного - ответь одной строкой «ничего нового» и закончи.
      Будить торговую сессию дорого, а забыть, кого ты будил час назад, легко:
      каждый твой запуск начинается с чистой памяти. Поэтому решает не новость, а
      цена - её видно всегда и она не зависит от того, что ты помнишь.
      Буди, только когда верны оба: есть открытая позиция по этой бумаге, И цена
      подошла к её проданному страйку ближе чем на треть того расстояния, которое
      было при открытии. Расстояние при открытии считай от цены входа из записи
      (read_state) или из заявки на открытие.
      Мнение чиновника, прогноз, приток или отток средств, объявленные тарифы -
      сами по себе не повод: рынок читает их без нас, они уже в цене, и если цена
      от нашего страйка не сдвинулась, будить некого.
      Если оба верны - поставь пробуждение через пять минут (wake_me_at) с причиной
      вида «проверь открытые позиции против этой новости: <новость>. Ничего нового не
      открывай», и скажи в чат, что именно нашёл.
      Заявок не отправляй: твоя работа - заметить, а не торговать.

  - name: defend
    cause: "проверка правил защиты"
    every: 30m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Если открытых позиций нет - скажи это одной строкой и закончи.
      **Сначала сосчитай ноги, и только потом думай о цене.** Твоё - и только
      оно - это РОВНО ДВЕ ноги: одна проданная и одна купленная, одного типа и
      одной экспирации. Это вертикаль.

      Всё прочее не твоё, и решается это счётом, а не узнаванием формы:
      - ног больше двух - не твоё, чем бы оно ни было;
      - купленных больше, чем проданных, - не твоё тем более.

      Считать, а не узнавать, приходится потому, что узнавание уже стоило денег.
      26 августа на соседнем счёте защита закрыла NVDA 222,5C/227,5C - один продан,
      два куплено - потому что цена стояла между страйками. Для вертикали это верно:
      там убыток растёт. Здесь между страйками лежит самая глубокая точка выплаты, а
      куплена конструкция ради движения ЗА дальнюю ногу. Закрыто по 0,61 дебета за
      набор, 14 наборов, минус $1 694 - ровно в тот день, ради которого покупалась.

      Слой выпуклости - backspread, одна проданная нога против ДВУХ купленных - не
      трогай вовсе. Железный кондор слоя отчётов -
      четыре ноги - тоже не вертикаль, даже если его тянет прочесть как две.
      И не думай о нём как о страховке: кондор это ПРОДАННАЯ премия, он
      зарабатывает, когда движения нет, и теряет максимум ровно в сильный день.
      Не трогаешь ты его по другой причине - у него своё правило выхода, наутро
      после отчёта, и ранний выкуп платит проход по четырём ногам, собирая часть.
      Убыток по нему растёт - это не работающая страховка, а обычный убыток внутри
      известной ширины; так и скажи, и всё равно пройди мимо. Он куплен ради дня сильного
      движения, то есть ради того самого дня, когда защита срабатывает чаще всего;
      закрыть его тогда - значит выбросить страховку ровно в момент, когда она
      начала работать. Не вертикаль - скажи это одной строкой и пройди мимо.
      **Закрывай, только когда цена прошла КУПЛЕННЫЙ страйк, а не проданный.**
      Замерено: research/exit_rules.py, 638 сделок за два с половиной года.
      Закрытие по касанию проданного даёт -0,33 доллара на сделку, закрытие по
      купленному +0,86, удержание до истечения +2,63. Разница между первым и
      вторым - доллар девятнадцать со сделки, и стоит она почти ничего: худшая
      серия глубже на четыре процента, худшая сделка та же.

      Причина в двух числах. Когда цена задевает проданный страйк, спред стоит
      около 0,62 ширины - закрытие фиксирует две трети максимального убытка. А
      37% таких случаев доживают ВНЕ денег: за два с половиной года это правило
      превратило 103 выигрыша в убытки. Вдобавок 38,5% срабатываний приходятся на
      первый бар дня, то есть цена ушла разрывом за ночь, и предотвращать нечего.

      Пройден купленный страйк - конструкция потеряна целиком, и закрытие
      освобождает покупательную способность, а не спасает деньги. Так и скажи.
      Больше ничего не закрывай: спред живёт распадом времени, и закрытая раньше
      срока позиция платит спред дважды, а собирает половину. Позиция с завтрашней
      экспирацией ночует - это нормально, риск у неё ограничен шириной конструкции.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть всё перед концом торгового дня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой позиции по опционам, истекающим СЕГОДНЯ, у которых проданный страйк
      ближе 50 центов к цене базового актива: именно они рискуют исполнением.
      Остальным сегодняшним дай истечь - выкуп центового спреда стоит дороже, чем он спасает.
      Позиции с более поздней экспирацией не трогай: они открыты вчера или сегодня и
      живут дальше, их риск ограничен шириной конструкции.
      Если позиция не закрылась лимитной заявкой за пять минут, закрывай по рынку:
      исполнение проданного put это 100 акций на каждый контракт до следующего дня,
      а проданного call - те же 100 акций в короткую, что не лучше.
      Назови результат дня и подтверди по брокеру, что осталось только то, чему дали истечь,
      и позиции с более поздней экспирацией.
