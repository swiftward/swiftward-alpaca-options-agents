kind: trading-agent
name: options-alpha-near
version: "1"
timezone: America/New_York

# Тот же движок, одно отличие: продаём БЛИЖЕ к деньгам.
#
# Опыт отвечает на один вопрос, и он же главная претензия к первому счёту -
# сделки собирают копейки. Проданная нога с дельтой около 0,15 уходит далеко от
# цены, редко проигрывает и почти ничего не платит. Нога с дельтой около 0,30
# стоит вдвое ближе: платит в разы больше и проигрывает заметно чаще. Что из
# этого выгоднее, спор не решает - решают два счёта в один и тот же день.
#
# Всё остальное совпадает с experiment.yaml намеренно: размер от убытка, предел
# портфеля по сумме максимальных убытков, лестница исполнения, запись намерения
# до заявки. Отличаться должно РОВНО ОДНО, иначе сравнивать будет нечего.

sessions:
  - name: open-check
    cause: "начало дня: что на счёте и что осталось со вчера"
    at: "09:35"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Скажи одной строкой: капитал, сколько позиций осталось со вчера, какая у них
      суммарная максимальная потеря. Ничего не открывай и не закрывай.

  - name: entry
    cause: "вход ближе к деньгам: проданная нога с дельтой около 0,30"
    every: 30m
    between: ["09:50", "15:30"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Продаём вертикальный кредитный спред, но ближе к деньгам, чем на соседнем
      счёте. Это единственное отличие, и держать его надо строго.
      - Бумаги: бери шесть из списка по кругу, начиная с тех, что не проверял
        сегодня: SPY, QQQ, IWM, AAPL, TSLA, META, MSFT, GOOGL, AMZN, NVDA, AMD,
        AVGO, NFLX, COIN, MU, PLTR, XLF, XLE, DIA, SMH.
      - Экспирация: от одного до пяти торговых дней. Сегодняшнюю не бери вовсе:
        в день истечения брокер не считает чувствительности, а платит она ноль.
      - Проданная нога: та, чья дельта ближе всего к 0,30 по модулю. Не 0,15.
        Купленная - соседний страйк, ширина один доллар (или один шаг страйков).
      - Сторона любая: put-спред ниже цены или call-спред выше. Смотри, чего у
        нас уже много, и не набирай третью позицию в одну сторону по одной бумаге.
      - Отношение кредита к риску не хуже 20%. Обе ноги с двусторонней котировкой.
      - Стоимость прохода (сумма разниц между покупкой и продажей по обеим ногам)
        не больше трети полученного кредита. Иначе конструкция не годится, какой
        бы красивой ни выглядела доля кредита к риску.
      - Размер: столько контрактов, чтобы максимальный убыток позиции не превысил
        2,5% капитала. Капитал спрашивай у брокера в каждом окне.
      - Предел портфеля: сумма максимальных убытков всех открытых позиций не
        больше 30% капитала. Дошли до предела - не открывай, скажи об этом.
      - Не больше трёх новых позиций за окно.
      - Запиши намерение (record_intent) до заявки: тезис, конструкция,
        максимальный убыток. В тезисе укажи дельту проданной ноги.
      - Отправь спред ОДНОЙ mleg-заявкой лимитом по середине, а в client_order_id
        напиши худшую цену в виде worst=-0.46 и через точку с запятой что-нибудь
        неповторяющееся - брокер отказывает, если имя уже видел. Худшая цена
        обязана удовлетворять тому же правилу, что и вход: отношение кредита к
        риску по НЕЙ не хуже 20%. Сверх этого - отдавать не больше трети кредита;
        берётся та из двух границ, что уступает меньше.
      - За заявкой не следи: её доводит харнесс - шагает ценой к стакану, ждёт на
        каждой цене и отменяет, если стакан так и не взял.
      - Одной строкой: что взял, с какой дельтой, за сколько, каков максимальный
        убыток, сколько всего под риском.

  - name: take-profit
    cause: "закрыть то, что уже отдало половину кредита"
    every: 15m
    between: ["09:55", "15:40"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Только кредитные вертикали: одна проданная нога и одна купленная, обе
      одного типа и одной экспирации. Всё остальное не трогай.
      Если конструкция отдала половину полученного кредита - закрой её ОДНОЙ
      встречной mleg-заявкой (купить проданную ногу, продать купленную), лимитом
      по середине, и укажи в client_order_id худшую цену в виде worst=0.09 (для
      закрытия цена положительная - это дебет).
      Если таких нет, скажи одной строкой, сколько каждая отдала, и закончи.
      Заявку дальше не веди: её доводит харнесс.

  - name: defend
    cause: "цена дошла до проданного страйка"
    every: 15m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Заявками на вход не занимайся: их ведёт харнесс.
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Закрой позицию, если цена базового актива прошла проданный страйк - для put
      это цена ниже страйка, для call выше. Ближняя нога здесь пересекается чаще,
      чем на соседнем счёте: это ожидаемо и есть цена того, что нам больше платят.
      Больше ничего не закрывай: спред живёт распадом времени, и закрытая раньше
      срока позиция платит проход дважды, а собирает половину.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть то, что рискует исполнением сегодня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой позиции по опционам, истекающим СЕГОДНЯ, у которых проданный страйк
      ближе 50 центов к цене базового актива: именно они рискуют исполнением.
      Остальным сегодняшним дай истечь.
      Позиции с более поздней экспирацией не трогай.
      Назови результат дня одним числом: капитал против вчерашнего закрытия.
