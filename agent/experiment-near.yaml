kind: trading-agent
name: options-alpha-near
version: "1"
timezone: America/New_York

# Тот же движок, одно отличие: продаём БЛИЖЕ к деньгам.
#
# Опыт отвечает на один вопрос, и он же главная претензия к первому счёту -
# сделки собирают копейки. Проданная нога с дельтой около 0,15 уходит далеко от
# цены, редко проигрывает и почти ничего не платит. Нога с дельтой около 0,30
# стоит вдвое ближе: платит в разы больше и проигрывает заметно чаще. Что из
# этого выгоднее, спор не решает - решают два счёта в один и тот же день.
#
# Всё остальное совпадает с experiment.yaml намеренно: размер от убытка, предел
# портфеля по сумме максимальных убытков, лестница исполнения, запись намерения
# до заявки. Отличаться должно РОВНО ОДНО, иначе сравнивать будет нечего.

sessions:
  - name: open-check
    cause: "начало дня: что на счёте и что осталось со вчера"
    at: "09:35"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Скажи одной строкой: капитал, сколько позиций осталось со вчера, какая у них
      суммарная максимальная потеря. Ничего не открывай и не закрывай.

  - name: entry
    cause: "вход ближе к деньгам: проданная нога с дельтой около 0,30"
    every: 10m
    between: ["09:50", "15:30"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Выполни premium-harvest, но ближе к деньгам, чем на соседнем счёте. Отличия
      **Где эта задача и скил расходятся - права ЗАДАЧА.** Скил описывает приём в
      общем виде и написан для всех счетов сразу; числа в нём - пример, а не закон.
      Если здесь сказано другое про дельту, сторону, порог или стоимость прохода -
      делай, как здесь, и скажи одной строкой, в чём разошлось. Молча взять число
      из скила вместо числа из задачи - это отменить опыт, ради которого счёт и
      существует.
      ниже - это весь смысл этого счёта, и держать их надо строго. Всё, о чём здесь
      не сказано, берётся из скила без изменений.
      - Проданная нога: та, чья дельта ближе всего к 0,30 по модулю. Не 0,15.
        Купленная - соседний страйк, ширина один доллар (или один шаг страйков).
      - Сторона любая: put-спред ниже цены или call-спред выше. Смотри, чего у нас
        уже много, и не набирай третью позицию в одну сторону по одной бумаге.
        Вторая сторона на бумагу, где уже открыта одна, - лучший обмен риска на
        кредит в этой книге: брокер держит залог по худшей из двух сторон, а не по
        сумме, потому что цена не может уйти и вверх, и вниз. Кредит при этом
        собирается свой.
      - Отдельного порога на отношение кредита к риску нет: оно целиком сидит
        внутри `edge_points`, потому что безубыточная вероятность и есть
        риск/(кредит+риск). Порог рядом с мерой - второе место, где живёт то же
        знание. Отбирай по преимуществу.
      - **Преимущество обязано быть больше нуля.** Лучшее в списке - не то же
        самое, что годное: список ранжирован, и первая строка стоит первой даже
        когда весь список отрицательный. Тогда правильный ход - не входить.
      - **Размер считай от `position_max_loss` конверта, а не от покупательной
        способности.** Отказ брокера по её нехватке означает ошибку в счёте на
        порядок; пересчитывать размер под остаток покупательной способности
        нельзя. Остановись и скажи, сколько насчитал и сколько разрешено.
      - **Бумаги ищи не сам: спроси read_candidates.** Скринер оценил за тебя весь
        разрешённый список - сотни бумаг, обе стороны, каждые пять минут. Перебор
        руками успевает шесть штук за ход, и шесть - это те, что достались по
        очереди, а не лучшие. Список пуст или инструмент недоступен - скажи это
        одной строкой и закончи ход.
      - **Конструкции, истекающие сегодня, разрешены, но мера у них слабее.**
        Брокер не даёт в этот день ни дельты, ни волатильности, поэтому
        волатильность занята у ближайшей другой экспирации; `edge_from` говорит
        «borrowed from another expiration». Занятое число ЗАВЫШАЕТ преимущество,
        поэтому там требуй преимущество строго больше нуля. Плюс не бери страйк
        ближе четверти процента от цены.
        И второе, про наши же часы: **однодневную конструкцию не открывай, когда
        до закрытия меньше сорока пяти минут.** Защита просыпается раз в
        пятнадцать минут, а лестница ведёт заявку до восьми - позиция, открытая
        позже, не может быть защищена НИ РАЗУ, и это не про величину риска, а про
        то, что механизм до неё не дотягивается. Посчитай время сам по часам
        брокера.
      - **Не продавай премию на бумаге, у которой отчёт до истечения конструкции.**
        Перед отчётом премия высокая и мера отбора показывает её как преимущество,
        но перед событием дельта занижает хвост. Продажа премии в событие - толстый
        левый хвост; на событие мы ставим покупкой выпуклости. Правило срабатывает на
        ПОДТВЕРЖДЁННУЮ дату до истечения, а не на молчание ленты: молчание не есть
        свидетельство, а хвост требует назначенного события.
      - Помни, чем этот счёт отличается: тебе нужна дельта около 0,30, а скринер
        отдаёт всё до 0,35. Из списка бери те, что БЛИЖЕ к деньгам, - на соседнем
        счёте берут дальние, и в этом весь опыт.
      - Не больше трёх новых позиций за окно.
      - В тезисе намерения укажи дельту проданной ноги.
      - Одной строкой: что взял, с какой дельтой, за сколько, каков максимальный
        убыток, сколько всего под риском.

  - name: take-profit
    cause: "закрыть то, что уже отдало половину кредита"
    every: 15m
    between: ["09:55", "15:40"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Только кредитные вертикали: одна проданная нога и одна купленная, обе
      одного типа и одной экспирации. Всё остальное не трогай.
      Если конструкция отдала половину полученного кредита - закрой её ОДНОЙ
      встречной mleg-заявкой (купить проданную ногу, продать купленную), лимитом
      по середине, и укажи в client_order_id худшую цену в виде worst=0.09 (для
      закрытия цена положительная - это дебет).
      Если таких нет, скажи одной строкой, сколько каждая отдала, и закончи.
      Заявку дальше не веди: её доводит харнесс.

  - name: defend
    cause: "цена дошла до проданного страйка"
    every: 15m
    between: ["09:40", "15:55"]
    days: [mon, tue, wed, thu, fri]
    task: |
      Заявками на вход не занимайся: их ведёт харнесс.
      Если открытых позиций нет - скажи это одной строкой и закончи.
      Закрой позицию, если цена базового актива прошла проданный страйк - для put
      это цена ниже страйка, для call выше.
      - **Цена ушла за КУПЛЕННУЮ ногу - не закрывай.** Когда обе ноги в деньгах,
        убыток спреда уже равен ширине и больше не вырастет: он ограничен по
        построению. Закрытие в этот момент не спасает ничего, а платит проход и
        отдаёт последнее, что осталось, - вероятность, что бумага вернётся обратно
        до истечения. Закрывай только когда цена МЕЖДУ проданным и купленным
        страйком: там убыток ещё растёт, и остановить его есть смысл.
        Живой случай 26 августа: META 575/577,5 call при цене 583 - за обеими
        ногами, - и закрытие предлагалось по 2,50 при ширине 2,50, то есть по
        полному убытку плюс проход.
      Ближняя нога здесь пересекается чаще, чем на соседнем счёте: это ожидаемо и
      есть цена того, что нам больше платят.
      Больше ничего не закрывай: спред живёт распадом времени, и закрытая раньше
      срока позиция платит проход дважды, а собирает половину.
      Иначе назови текущий результат по каждой позиции и ничего не трогай.

  - name: flatten
    cause: "закрыть то, что рискует исполнением сегодня"
    at: "15:50"
    within: 20m
    days: [mon, tue, wed, thu, fri]
    task: |
      Закрой позиции по опционам, истекающим СЕГОДНЯ, у которых цена базового актива
      подошла к проданному страйку ближе, чем ШИРИНА самой конструкции. Не «ближе
      пятидесяти центов»: это число из тех дней, когда позиция была в один-пять
      контрактов, а ширина - мера самой конструкции и растёт вместе с ней.
      Опасность ровно одна: цена закрывается МЕЖДУ ногами. Тогда проданная нога
      исполняется, купленная истекает пустой, и вместо ограниченного убытка выходит
      позиция в АКЦИЯХ. Ширина - размер той щели; всё, что дальше, туда не попадёт.
      Считай, чем рискуешь, а не сколько стоит выкуп: выкуп ограничен и известен,
      исполнение - нет.
      Остальным сегодняшним дай истечь.
      Позиции с более поздней экспирацией не трогай.
      Назови результат дня одним числом: капитал против вчерашнего закрытия.
