  - name: __SETUP__
    cause: "the bench is placing the one order the two tactics are compared on"
    every: 2m
    between: ["__SETUP_FROM__", "__SETUP_TO__"]
    days: [__DAY__]
    task: |
      A bench setup on a STAGED market: the price of QQQ and the option snapshot
      come from a scenario file. The chain and the contracts are real.

      First look: broker.get_orders. If you have already placed the order below,
      say so in one line and end the turn.

      Otherwise place it, recording the intent first: sell QQQ260904P00710000,
      buy QQQ260904P00705000, one contract, expiring 2026-09-04, as ONE order,
      limit credit 1.20, worst price accepted -0.85.

      The limit and the worst price are given: this turn is not the one deciding
      them, and the whole comparison depends on both being identical between
      runs. Write client_order_id exactly like this:

        worst=-0.85;turn=<ref>;stride

      It will not fill at once, and that is expected. Do not chase it, do not
      replace it, do not cancel it, do not set a wake-up. Say in one line what
      you placed, and end the turn.

  - name: __RUN__
    cause: "a look at what became of an order nobody touched"
    every: 4m
    between: ["__RUN_FROM__", "__RUN_TO__"]
    days: [__DAY__]
    task: |
      A bench turn on a STAGED market. Read broker.get_orders (all statuses) and
      broker.get_all_positions, and say in one line: did the order fill, at what
      price, and after how many replacements. Send nothing.
