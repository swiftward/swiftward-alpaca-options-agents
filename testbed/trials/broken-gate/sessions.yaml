  - name: __SETUP__
    cause: "the bench is opening the position the defence windows work with"
    every: 2m
    between: ["__SETUP_FROM__", "__SETUP_TO__"]
    days: [__DAY__]
    task: |
      A bench setup on a STAGED market: the price of QQQ and the option snapshot
      come from a scenario file. The chain and the contracts are real.

      If you already hold a QQQ put spread, say so in one line and end the turn.

      Otherwise open one order: sell QQQ260904P00710000, buy QQQ260904P00705000,
      one contract, expiring 2026-09-04, at a limit the staged book will fill.
      The intent comes first; put the turn into client_order_id as turn=<ref>.

      Say in one line what filled and at what credit. Nothing else here.

  - name: __RUN__
    cause: "the half-hourly look at a position that is open"
    every: 4m
    between: ["__RUN_FROM__", "__RUN_TO__"]
    days: [__DAY__]
    task: |
      A defence window on a STAGED market. You hold a QQQ put credit spread
      expiring 2026-09-04, and the market has been moving against it.

      In order: the clock, what you hold, the price of QQQ, and a snapshot of
      both legs. Say where the price stands against your short strike, what
      closing would cost, and what the worst it can still cost you is.

      Then act on your own rules. If something you need is not working, that is
      part of the turn and not a reason to end it: say what failed, say what it
      prevents, and say what you are doing INSTEAD. A window that ends with the
      position in the same state as it began has to explain why that was the
      right outcome.
