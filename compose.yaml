name: swiftward-alpaca-options-agents

# Local stack, built from this checkout. `make up` builds and starts it.
#
# Two networks on purpose. `internal` has no route out and cannot publish a port.
# The services that must reach the public internet - Alpaca's own server, and the
# page a browser opens - also sit on `outbound`. The agent sits on `internal`
# alone, so its only ways anywhere are the services beside it and the egress
# proxy, whose allowlist it cannot widen.

x-broker-service: &broker-service
  restart: unless-stopped
  build:
    context: .
    dockerfile: docker/alpaca-mcp.Dockerfile
  networks: [internal, outbound]

x-broker-environment: &broker-environment
  ALPACA_PAPER_TRADE: ${ALPACA_PAPER}
  ALPACA_TOOLSETS: ${ALPACA_TOOLSETS}

x-agent-service: &agent-service
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: agent
    args:
      AGENT_UID: ${AGENT_UID}
  networks: [internal]
  # The claims the architecture makes about this container, enforced here: it
  # cannot write outside its work directory, cannot gain privileges, and holds
  # no capability it was not given.
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  depends_on:
    migrate:
      condition: service_completed_successfully
  profiles: [session]

# Everything an agent needs that does NOT depend on which account it trades.
# What does depend on the account - the record, the broker's server, the
# declaration, and whether it speaks in the room - is set on each agent, and is
# the whole difference between them.
x-agent-environment: &agent-environment
  ROLES: harness,mcp
  MCP_ADDR: ":8081"
  SESSION_MCP_URL: http://127.0.0.1:8081
  RECORD_SHOWS: ${RECORD_SHOWS}
  AGENT_COMMAND: codex
  AGENT_DIR: /work
  # The container is the sandbox: root filesystem read-only, one writable
  # directory, no route out except the proxy. The agent's own sandbox needs
  # user namespaces this container does not grant, and running two boundaries
  # where one is real would only stall every command.
  AGENT_SANDBOX: danger-full-access
  AGENT_MODEL: ${AGENT_MODEL}
  AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT}
  # Kept in the work volume, so a restart continues the same conversation.
  THREAD_FILE: /work/.thread
  WAKEUP_FILE: /work/wakeups.json
  # One request to the agent may take this long. Past it the chat is told,
  # rather than the whole room waiting on a session that stopped answering.
  AGENT_CALL_TIMEOUT: ${AGENT_CALL_TIMEOUT}
  THREAD_RESUME_LIMIT: ${THREAD_RESUME_LIMIT}
  # Дольше этого один ход не живёт: за ним ждут другие сессии, и защита,
  # которая не отработала из-за длинного перебора, хуже перебора.
  TURN_LIMIT: ${TURN_LIMIT}
  # Пауза между тем, что комната слышит от сессии. Тринадцать сессий по
  # четыре реплики - это отказ Telegram, за которым ждёт нужный ответ.
  SAY_EVERY: ${SAY_EVERY}
  # The screener prices the whole permitted universe over and over, so a session
  # chooses from what the market offers rather than from the few names its turn
  # had time to look at. It reads and cannot order.
  SCREENER_UNDERLYINGS: ${SCREENER_UNDERLYINGS}
  SCREENER_EVERY: ${SCREENER_EVERY}
  SCREENER_PER_MINUTE: ${SCREENER_PER_MINUTE}
  SCREENER_EXPIRATIONS: ${SCREENER_EXPIRATIONS}
  SCREENER_NEAREST: ${SCREENER_NEAREST}
  SCREENER_FURTHEST: ${SCREENER_FURTHEST}
  SCREENER_LEAST_PAID: ${SCREENER_LEAST_PAID}
  SCREENER_MOST_PAID: ${SCREENER_MOST_PAID}
  SCREENER_MOST_DELTA: ${SCREENER_MOST_DELTA}
  SCREENER_LEAST_EDGE: ${SCREENER_LEAST_EDGE}
  SCREENER_DEAREST: ${SCREENER_DEAREST}
  # The volatility history the entry rules compare against. It is worth what
  # its length is, so it starts on the first day and is never paused.
  VOLATILITY_UNDERLYINGS: ${VOLATILITY_UNDERLYINGS}
  VOLATILITY_EVERY: ${VOLATILITY_EVERY}
  # How often the account's own value is written down: the week is judged on
  # the line those readings draw.
  ACCOUNT_EVERY: ${ACCOUNT_EVERY}
  # The ladder that walks an unfilled structure toward the price the book
  # shows. It finishes what a session started and can open nothing.
  EXECUTION_EVERY: ${EXECUTION_EVERY}
  EXECUTION_STEP: ${EXECUTION_STEP}
  EXECUTION_PATIENCE: ${EXECUTION_PATIENCE}
  # Where the session asks what it is allowed to do. Until the policy gateway is
  # in front of the broker, this is the stand-in beside it - under the same name,
  # so the session cannot tell the two apart and needs no change when they swap.
  # The token is NOT here: which limits apply is the one thing the two agents must
  # not share.
  GATEWAY_URL: ${GATEWAY_URL:-http://envelope:8090/mcp}
  HTTP_PROXY: http://egress:8888
  HTTPS_PROXY: http://egress:8888
  NO_PROXY: alpaca-mcp,alpaca-mcp-near,envelope,postgres,egress,localhost,127.0.0.1
  CODEX_HOME: /home/agent/.codex

services:
  postgres:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The schema, applied before anything reads it. Files run in name order, and
  # each is written to be safe to run again, so a restart is not a special case.
  migrate:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      RECORD_DATABASES: ${RECORD_DATABASES}
    volumes:
      - ./postgres/migrations:/migrations:ro
      - ./postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # The database tier: the record's tests against the real Postgres, run beside
  # it on the network that has no route out. `make test-db` starts this.
  tests:
    image: golang:1.27-alpine
    networks: [internal]
    working_dir: /src
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${TEST_DATABASE}?sslmode=disable
      BROKER_MCP_URL: http://alpaca-mcp:8000/mcp
      GOFLAGS: -buildvcs=false
      # This network has no route out, so every module must already be in the
      # cache mounted below. A download here is an error, not a wait.
      GOPROXY: "off"
      GOCACHE: /tmp/gocache
    volumes:
      - ./golang:/src
      - ./postgres:/postgres:ro
      - ${GOMODCACHE}:/go/pkg/mod
    command: ["go", "test", "-tags", "db", "-count=1", "./internal/record/...", "./internal/volatility/..."]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [test]

  # Alpaca's own MCP server. The account keys live here and nowhere else; no host
  # port, so the only caller is the policy gateway.
  alpaca-mcp:
    <<: *broker-service
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${ALPACA_API_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_API_SECRET_KEY}

  # The second account. Its keys are the only thing that differs: one server
  # holds one account's keys, given at startup, so an account needs a server.
  alpaca-mcp-near:
    <<: *broker-service
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${ALPACA_NEAR_API_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_NEAR_API_SECRET_KEY}

  # The session's container: the harness role plus the agent it starts. It holds
  # no credential of ours; the login it does carry is Codex's own, mounted from
  # the host that performed it.
  # The read side: the demo page and the JSON behind it. It reads the record and
  # nothing else - no credential, no broker, no decision - so it is the one
  # service that may sit where a browser can reach it.
  page:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: page
    networks: [internal, outbound]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RECORD_SHOWS: ${RECORD_SHOWS}
      # The read side asks the broker what the account is worth. It only reads:
      # the money questions have no order in them.
      BROKER_MCP_URL: ${BROKER_MCP_URL}
      ORDERS_SHOWN: ${ORDERS_SHOWN}
      HISTORY_DAYS: ${HISTORY_DAYS}
    ports:
      - "${APP_PORT}:8080"
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent:
    <<: *agent-service
    environment:
      <<: *agent-environment
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Set only while the gateway is not yet in front of the broker, and only on
      # a development account.
      BROKER_MCP_URL: ${BROKER_MCP_URL}
      DECLARATION: ${DECLARATION:-/agent/agent.yaml}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
    volumes:
      - ${CODEX_AUTH_DIR}:/mnt/codex:ro
      - codex-home:/home/agent/.codex
      - agent-work:/work

  # The second account: the same engine selling NEARER the money. It keeps its
  # own record, because a shared one would let this agent's restart close the
  # other's live turns and let either skip a session the other already ran.
  #
  # It speaks in its own topic through its own bot. Sharing the first agent's bot
  # was not possible: Telegram allows one reader per bot, so the two would have
  # taken the channel from each other in turns. Its own bot also names itself in
  # the room, so which of the two is speaking is read, not inferred.
  agent-near:
    <<: *agent-service
    environment:
      <<: *agent-environment
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agents_near?sslmode=disable
      BROKER_MCP_URL: http://alpaca-mcp-near:8000/mcp
      DECLARATION: /agent/experiment-near.yaml
      GATEWAY_TOKEN: ${GATEWAY_NEAR_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_NEAR_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_NEAR_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
    volumes:
      - ${CODEX_AUTH_DIR}:/mnt/codex:ro
      - codex-home-near:/home/agent/.codex
      - agent-near-work:/work

  # What the session asks about its own limits. It stands where the policy gateway
  # will stand, and answers the one question that gateway answers first: what am I
  # allowed to do, and by which version of the rules.
  #
  # It holds no broker credential and reaches nothing: it reads a file and
  # answers. Judging an order and refusing it are the gateway's, not its, and it
  # is deliberately unable to do either.
  envelope:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: envelope
    networks: [internal]
    environment:
      ROLES: envelope
      ENVELOPE_ADDR: ":8090"
      ENVELOPE_PATH: /policy/envelope.yaml
      # Which token belongs to which caller. It lives here and not in the ruleset
      # because the ruleset is committed and a token is not.
      ENVELOPE_CALLERS: ${ENVELOPE_CALLERS}
    volumes:
      # The working copy over the shipped one: an operator lowering a ceiling
      # edits this file, and the session reads the new number on its next
      # question, with nothing restarted.
      - ./policy/envelope.yaml:/policy/envelope.yaml:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The only door out. Hosts not named in docker/egress/filter.txt are refused.
  egress:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/egress.Dockerfile
    networks: [internal, outbound]

networks:
  internal:
    internal: true
  outbound:

volumes:
  pgdata:
  codex-home:
  agent-work:
  codex-home-near:
  agent-near-work:
