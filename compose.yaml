name: swiftward-alpaca-options-agents

# Local stack, built from this checkout. `make up` builds and starts it.
#
# Two networks on purpose. `internal` has no route out and cannot publish a port.
# The services that must reach the public internet - Alpaca's own server, and the
# page a browser opens - also sit on `outbound`. The agent sits on `internal`
# alone, so its only ways anywhere are the services beside it and the egress
# proxy, whose allowlist it cannot widen.

x-broker-service: &broker-service
  restart: unless-stopped
  # One image per KIND, named here rather than derived from the service. Compose
  # names a built image after the service, so four services building this same
  # file produced four images, and `up --build` on one of them left the others on
  # whatever they were built from. On 29 August that ran the two agents on builds
  # six hours apart.
  image: swiftward-alpaca-options-agents/alpaca-mcp:local
  build:
    context: .
    dockerfile: docker/alpaca-mcp.Dockerfile
  networks: [internal, outbound]
  # Its own resolvers, as the proxy has. Without them the container asks the
  # machine's resolver, and on 27 August that one returned failures in bursts: six
  # unresolved lookups in three minutes, each turning into "the broker refused
  # get_orders" at the ladder - a refusal that looks like the broker's decision
  # when the broker was never asked. The name did not resolve; Alpaca was never
  # reached.
  dns: [1.1.1.1, 8.8.8.8]

x-broker-environment: &broker-environment
  ALPACA_PAPER_TRADE: ${ALPACA_PAPER}
  ALPACA_TOOLSETS: ${ALPACA_TOOLSETS}

x-agent-service: &agent-service
  image: swiftward-alpaca-options-agents/agent:local
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: agent
    args:
      AGENT_UID: ${AGENT_UID}
  networks: [internal]
  # The claims the architecture makes about this container, enforced here: it
  # cannot write outside its work directory, cannot gain privileges, and holds
  # no capability it was not given.
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  depends_on:
    migrate:
      condition: service_completed_successfully
  profiles: [session]

# Everything an agent needs that does NOT depend on which account it trades.
# What does depend on the account - the record, the broker's server, the
# declaration, and whether it speaks in the room - is set on each agent, and is
# the whole difference between them.
x-agent-environment: &agent-environment
  ROLES: harness,mcp
  MCP_ADDR: ":8081"
  SESSION_MCP_URL: http://127.0.0.1:8081
  RECORD_SHOWS: ${RECORD_SHOWS}
  # Empty is the normal state: what the session's configuration reads is already
  # in the fixed set agent.Environment carries.
  AGENT_ENV_KEEP: ${AGENT_ENV_KEEP:-}
  AGENT_COMMAND: codex
  AGENT_DIR: /work
  # The container is the sandbox: root filesystem read-only, one writable
  # directory, no route out except the proxy. The agent's own sandbox needs
  # user namespaces this container does not grant, and running two boundaries
  # where one is real would only stall every command.
  AGENT_SANDBOX: danger-full-access
  AGENT_MODEL: ${AGENT_MODEL}
  AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT}
  # Kept in the work volume, so a restart continues the same conversation.
  THREAD_FILE: /work/.thread
  WAKEUP_FILE: /work/wakeups.json
  # One request to the agent may take this long. Past it the chat is told,
  # rather than the whole room waiting on a session that stopped answering.
  AGENT_CALL_TIMEOUT: ${AGENT_CALL_TIMEOUT}
  THREAD_RESUME_LIMIT: ${THREAD_RESUME_LIMIT}
  # No single turn lives longer than this: other sessions are waiting behind it,
  # and a defence that did not run because of a long search is worse than the
  # search.
  TURN_LIMIT: ${TURN_LIMIT}
  # The pause between the things the room hears from a session. Thirteen sessions
  # at four lines each is a refusal from Telegram, with the answer that matters
  # waiting behind it.
  SAY_EVERY: ${SAY_EVERY}
  # The screener prices the whole permitted universe over and over, so a session
  # chooses from what the market offers rather than from the few names its turn
  # had time to look at. It reads and cannot order.
  SCREENER_UNDERLYINGS: ${SCREENER_UNDERLYINGS}
  SCREENER_EVERY: ${SCREENER_EVERY}
  SCREENER_KEEP: ${SCREENER_KEEP}
  SCREENER_PER_MINUTE: ${SCREENER_PER_MINUTE}
  SCREENER_WORKERS: ${SCREENER_WORKERS}
  SCREENER_EXPIRATIONS: ${SCREENER_EXPIRATIONS}
  # The volatility history the entry rules compare against. It is worth what
  # its length is, so it starts on the first day and is never paused.
  VOLATILITY_UNDERLYINGS: ${VOLATILITY_UNDERLYINGS}
  VOLATILITY_EVERY: ${VOLATILITY_EVERY}
  # How often the account's own value is written down: the week is judged on
  # the line those readings draw.
  ACCOUNT_EVERY: ${ACCOUNT_EVERY}
  # The ladder that walks an unfilled structure toward the price the book
  # shows. It finishes what a session started and can open nothing.
  # The share of the credit received at which a winning structure is bought back.
  # MEASURED: research/threshold.py, 29 August 2026, on the minute-by-minute path
  # of all 553 trades the rule selected across 646 days. Sitting to expiry gives
  # 2,287 dollars and 26% losing trades; closing at 35% gives 6,292 and 9%. Better
  # on both axes at once. The peak is exactly at 35%, and both halves of the
  # history agree on it - a plateau from 35 to 40, a cliff after 50.
  # Half a minute. The point is to be there when the number crosses the line: the
  # defence comes round every thirty minutes and on 28 August it missed a spread
  # that gave back three quarters of its credit.
  TAKE_PROFIT_EVERY: ${TAKE_PROFIT_EVERY}
  EXECUTION_EVERY: ${EXECUTION_EVERY}
  EXECUTION_STEP: ${EXECUTION_STEP}
  EXECUTION_PATIENCE: ${EXECUTION_PATIENCE}
  # How far one step travels. Set per agent below, because the two accounts are
  # what lets an execution tactic be tried without betting the week on it.
  EXECUTION_STRIDE: ${EXECUTION_STRIDE}
  # The whole policy directory is mounted, never the single file inside it. A
  # one-file bind mount holds the file's inode, so anything that REPLACES the
  # file rather than rewriting it - git checkout, a rebase, an editor that writes
  # through a temporary - leaves the container reading the old content and says
  # nothing. Measured 28 August: limits were lowered on the host and the envelope
  # served the previous numbers for seven minutes, while the code that re-reads
  # the file on every call was working exactly as written.
  # Where the session asks what it is allowed to do. Until the policy gateway is
  # in front of the broker, this is the stand-in beside it - under the same name,
  # so the session cannot tell the two apart and needs no change when they swap.
  # The token is NOT here: which limits apply is the one thing the two agents must
  # not share.
  # Read the playbooks from here rather than from the image: the checkout is
  # mounted alongside, so an edit to their text reaches a running session. In the
  # image the default is /agent/skills.
  SKILLS_DIR: /mnt/skills
  GATEWAY_URL: ${GATEWAY_URL:-http://envelope:8090/mcp}
  # Every outbound request goes through the policy gateway, which records where
  # the agent went and decides whether it may. The host list it enforces is the
  # one the outbound proxy enforced before it - nothing new is refused, and now
  # there is a record of what was asked for.
  # The way out. The default is the internet gateway that stands beside the rest
  # of the stack; a stand running on someone's own machine is not on that network
  # and names its own way out instead.
  HTTP_PROXY: ${AGENT_1_OUTBOUND_PROXY:-http://swiftward-hackathon-server:8097}
  HTTPS_PROXY: ${AGENT_1_OUTBOUND_PROXY:-http://swiftward-hackathon-server:8097}
  NO_PROXY: alpaca-mcp-agent-1,alpaca-mcp-agent-2,alpaca-mcp-agent-tikhon,alpaca-mcp-agent-stand,envelope,postgres,egress,swiftward-hackathon-server,localhost,127.0.0.1
  CODEX_HOME: /home/agent/.codex

services:
  postgres:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The schema, applied before anything reads it. Files run in name order, and
  # each is written to be safe to run again, so a restart is not a special case.
  migrate:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      RECORD_DATABASES: ${RECORD_DATABASES}
    volumes:
      - ./postgres/migrations:/migrations:ro
      - ./postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # The database tier: the record's tests against the real Postgres, run beside
  # it on the network that has no route out. `make test-db` starts this.
  tests:
    image: golang:1.27-alpine
    networks: [internal]
    working_dir: /src
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${TEST_DATABASE}?sslmode=disable
      BROKER_MCP_URL: http://alpaca-mcp-agent-1:8000/mcp
      GOFLAGS: -buildvcs=false
      # This network has no route out, so every module must already be in the
      # cache mounted below. A download here is an error, not a wait.
      GOPROXY: "off"
      GOCACHE: /tmp/gocache
    volumes:
      - ./golang:/src
      - ./postgres:/postgres:ro
      - ${GOMODCACHE:-./.gomodcache}:/go/pkg/mod
    command: ["go", "test", "-tags", "db", "-count=1", "./internal/db/...", "./internal/record/...", "./internal/volatility/..."]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [test]

  # Reconciliation: every order the broker holds, against what our record says
  # about it. It runs HERE rather than from a shell because the record's Postgres
  # publishes no port - it is reachable only from this network - and the command
  # written in the plan (`go run ./apps/reconcile` from a terminal) fails on that
  # with a connection refused. Found on 29 August, which is the day before it
  # would have been needed.
  #
  #   AGENT=alpaca-agent-1 RECONCILE_SINCE=12h make reconcile
  #
  reconcile:
    image: golang:1.27-alpine
    networks: [internal]
    working_dir: /src
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${RECONCILE_DB:-${POSTGRES_DB}}?sslmode=disable
      # Through the gateway, like every other call this project makes to the
      # broker: reconciling against a different road than the orders took would
      # compare two things and call them one.
      BROKER_MCP_URL: ${RECONCILE_BROKER_URL:-${AGENT_1_BROKER_MCP_URL}}
      BROKER_MCP_TOKEN: ${RECONCILE_BROKER_TOKEN:-${AGENT_1_BROKER_MCP_TOKEN}}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      RECONCILE_SINCE: ${RECONCILE_SINCE:-12h}
      GOFLAGS: -buildvcs=false
      GOPROXY: "off"
      GOCACHE: /tmp/gocache
    volumes:
      - ./golang:/src
      - ${GOMODCACHE:-./.gomodcache}:/go/pkg/mod
    command: ["go", "run", "./apps/reconcile"]
    profiles: [tools]

  # The load a trading day puts on the read path, sent while nothing is at stake.
  # It goes down the same road the screener does - each agent's own entry point
  # with its own credential - because a rehearsal on a different road measures a
  # different system. See the Makefile target for what it cost not to have this.
  rehearse:
    image: golang:1.27-alpine
    networks: [internal]
    working_dir: /src
    environment:
      REHEARSE_CALLERS: alpaca-agent-1,alpaca-agent-2
      REHEARSE_URL_ALPACA_AGENT_1: ${AGENT_1_BROKER_MCP_URL}
      REHEARSE_TOKEN_ALPACA_AGENT_1: ${AGENT_1_BROKER_MCP_TOKEN}
      REHEARSE_URL_ALPACA_AGENT_2: ${AGENT_2_BROKER_MCP_URL}
      REHEARSE_TOKEN_ALPACA_AGENT_2: ${AGENT_2_BROKER_MCP_TOKEN}
      REHEARSE_UNDERLYINGS: ${SCREENER_UNDERLYINGS}
      USER_TOKEN: ${USER_TOKEN}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      GOFLAGS: -buildvcs=false
      GOPROXY: "off"
      GOCACHE: /tmp/gocache
    volumes:
      - ./golang:/src
      - ${GOMODCACHE:-./.gomodcache}:/go/pkg/mod
    command: ["go", "run", "./apps/rehearse"]
    profiles: [tools]

  # Alpaca's own MCP server. The account keys live here and nowhere else; no host
  # port, so the only caller is the policy gateway.
  alpaca-mcp-agent-1:
    <<: *broker-service
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${AGENT_1_ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${AGENT_1_ALPACA_SECRET_KEY}

  # The second account. Its keys are the only thing that differs: one server
  # holds one account's keys, given at startup, so an account needs a server.
  alpaca-mcp-agent-2:
    <<: *broker-service
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${AGENT_2_ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${AGENT_2_ALPACA_SECRET_KEY}

  # A teammate's own account. Their server, their keys, and a gateway endpoint of
  # its own - because this server reads its credentials from its own environment,
  # so one process serves exactly one account and no request can say otherwise.
  #
  # Behind a profile: it does not start until someone asks for it by name, and a
  # server with no keys would answer every call with an authentication error that
  # reads like a broken gateway.
  #
  #   docker compose --profile tikhon up -d alpaca-mcp-agent-tikhon
  alpaca-mcp-agent-tikhon:
    <<: *broker-service
    profiles: [tikhon]
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${AGENT_TIKHON_ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${AGENT_TIKHON_ALPACA_SECRET_KEY}

  # The same teammate's DEMO STAND, on a second account of his. One process per
  # account is why this is a service of its own rather than a setting on the one
  # above: the server reads its keys from its own environment.
  #
  #   docker compose --profile tikhon up -d alpaca-mcp-agent-stand
  alpaca-mcp-agent-stand:
    <<: *broker-service
    profiles: [tikhon]
    environment:
      <<: *broker-environment
      ALPACA_API_KEY: ${AGENT_STAND_ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${AGENT_STAND_ALPACA_SECRET_KEY}

  # The session's container: the harness role plus the agent it starts. It holds
  # no credential of ours; the login it does carry is Codex's own, mounted from
  # the host that performed it.
  # The read side: the demo page and the JSON behind it. It reads the record and
  # nothing else - no credential, no broker, no decision - so it is the one
  # service that may sit where a browser can reach it.
  page-agent-1:
    image: swiftward-alpaca-options-agents/page:local
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: page
    networks: [internal, outbound]
    # Its own resolvers: the page goes to the gateway for the money, and it would
    # show a name-resolution failure as the broker being unavailable.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      # The page serves the limits from the SAME file, through the same call that
      # answers the agent. Otherwise it would show a retelling, and one day the
      # retelling differs from what is actually traded, and a judge is shown a
      # story about the system rather than the system. It reads and only reads: the
      # page cannot edit the envelope.
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: ${AGENT_1_ENVELOPE_IDENTITY:-alpaca-agent-1}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RECORD_SHOWS: ${RECORD_SHOWS}
      # The read side asks the broker what the account is worth. It only reads:
      # the money questions have no order in them - and it carries a credential
      # that CANNOT send one, so a leak here is not a trade.
      #
      # That last guarantee is the GATEWAY's, not this service's: the credential
      # is refused an order because the gateway refuses it. Pointed at the
      # broker's own server the same page could send one, so this address is its
      # own variable and does not follow the harness off the gateway.
      BROKER_MCP_URL: ${AGENT_1_PAGE_MCP_URL}
      BROKER_MCP_TOKEN: ${AGENT_1_PAGE_MCP_TOKEN}
      # The person the page acts for. The gateway endpoint resolves a caller from
      # BOTH the credential and this header, and until 29 August the page sent
      # only the first: every request came back "Identity unresolved" and the page
      # answered 503 "the broker is unavailable" - on the page a judge opens, for
      # the whole of the account panel. The agents had always sent it; the page
      # was written before the endpoint required it and nobody read /api/money
      # again afterwards.
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      ORDERS_SHOWN: ${ORDERS_SHOWN}
      HISTORY_DAYS: ${HISTORY_DAYS}
    ports:
      - "${AGENT_1_PAGE_PORT}:8080"
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    volumes:
      # Read-only: the page shows the limits and cannot change them. The same file
      # the envelope and the ladder read - one source for everyone, or what is
      # shown and what is in force diverge in silence.
      - ./policy:/policy:ro

  # The second page: the same program over the SECOND account's record. The agents
  # keep separate records - `agents` and `agents_near` - so one page physically
  # cannot show both, and which account we show a judge is decided on the last day.
  # It does not show money yet: there is no observer role and no key for the second
  # account, so its broker address is empty. The record - turns, calls, intents,
  # words - is fully visible.
  page-agent-2:
    image: swiftward-alpaca-options-agents/page:local
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: page
    networks: [internal, outbound]
    # Its own resolvers: the page goes to the gateway for the money, and it would
    # show a name-resolution failure as the broker being unavailable.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      # The page serves the limits from the SAME file, through the same call that
      # answers the agent. Otherwise it would show a retelling, and one day the
      # retelling differs from what is actually traded, and a judge is shown a
      # story about the system rather than the system. It reads and only reads: the
      # page cannot edit the envelope.
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: ${AGENT_2_ENVELOPE_IDENTITY:-alpaca-agent-2}
      # Its own read-only credential, and its own gateway endpoint. Until 29
      # August this page had NEITHER: it answered 501 "no broker is configured"
      # where the account panel should be, because no read-only role for this
      # account had ever been created at the gateway. The first page had one, the
      # teammate's had one, this one was missed.
      BROKER_MCP_URL: ${AGENT_2_PAGE_MCP_URL}
      BROKER_MCP_TOKEN: ${AGENT_2_PAGE_MCP_TOKEN}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agents_near?sslmode=disable
      RECORD_SHOWS: ${RECORD_SHOWS}
      ORDERS_SHOWN: ${ORDERS_SHOWN}
      HISTORY_DAYS: ${HISTORY_DAYS}
    ports:
      - "${AGENT_2_PAGE_PORT}:8080"
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    volumes:
      # Read-only: the page shows the limits and cannot change them. The same file
      # the envelope and the ladder read - one source for everyone, or what is
      # shown and what is in force diverge in silence.
      - ./policy:/policy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A page for the teammate's account. The record panels are empty here on
  # purpose - his agent writes to his own database, not ours - but the MONEY comes
  # from the broker through the read-only endpoint the gateway already grants for
  # his account, so the team's report can carry every account's figure without
  # anyone reading a trading key by hand.
  #
  # Behind the same profile as his broker server: it starts when someone asks for
  # it by name.
  page-agent-tikhon:
    image: swiftward-alpaca-options-agents/page:local
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: page
    networks: [internal, outbound]
    # Its own resolvers: the page goes to the gateway for the money, and it would
    # show a name-resolution failure as the broker being unavailable.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      # The page serves the limits from the SAME file, through the same call that
      # answers the agent. Otherwise it would show a retelling, and one day the
      # retelling differs from what is actually traded, and a judge is shown a
      # story about the system rather than the system. It reads and only reads: the
      # page cannot edit the envelope.
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: alpaca-agent-tikhon
      # Its own read-only credential, and its own gateway endpoint. Until 29
      # August this page had NEITHER: it answered 501 "no broker is configured"
      # where the account panel should be, because no read-only role for this
      # account had ever been created at the gateway. The first page had one, the
      # teammate's had one, this one was missed.
      BROKER_MCP_URL: ${AGENT_TIKHON_PAGE_MCP_URL}
      BROKER_MCP_TOKEN: ${AGENT_TIKHON_PAGE_MCP_TOKEN}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      # No record here, and that is the whole configuration: this account's
      # agent runs elsewhere and keeps its work elsewhere. Pointed at a
      # database, this page showed the FIRST agent's equity line and intents
      # beside its own account's money, which is what it did until 31 August.
      # Without one the page serves the money and answers plainly that no
      # history is kept here.
    ports:
      - "${AGENT_TIKHON_PAGE_PORT:-8803}:8080"
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    volumes:
      # Read-only: the page shows the limits and cannot change them. The same file
      # the envelope and the ladder read - one source for everyone, or what is
      # shown and what is in force diverge in silence.
      - ./policy:/policy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tikhon]

  # The demo stand's page. This is the account that trades from Monday's kickoff,
  # so its figure is the one the submission is judged on - the account beside it
  # is a teammate's local testing.
  page-agent-stand:
    image: swiftward-alpaca-options-agents/page:local
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: page
    networks: [internal, outbound]
    # Its own resolvers: the page goes to the gateway for the money, and it would
    # show a name-resolution failure as the broker being unavailable.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      # The page serves the limits from the SAME file, through the same call that
      # answers the agent. Otherwise it would show a retelling, and one day the
      # retelling differs from what is actually traded, and a judge is shown a
      # story about the system rather than the system. It reads and only reads: the
      # page cannot edit the envelope.
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: alpaca-agent-stand
      # Its own read-only credential, and its own gateway endpoint. Until 29
      # August this page had NEITHER: it answered 501 "no broker is configured"
      # where the account panel should be, because no read-only role for this
      # account had ever been created at the gateway. The first page had one, the
      # teammate's had one, this one was missed.
      BROKER_MCP_URL: ${AGENT_STAND_PAGE_MCP_URL}
      BROKER_MCP_TOKEN: ${AGENT_STAND_PAGE_MCP_TOKEN}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      # No record here, and that is the whole configuration: this account's
      # agent runs elsewhere and keeps its work elsewhere. Pointed at a
      # database, this page showed the FIRST agent's equity line and intents
      # beside its own account's money, which is what it did until 31 August.
      # Without one the page serves the money and answers plainly that no
      # history is kept here.
    ports:
      - "${AGENT_STAND_PAGE_PORT:-8804}:8080"
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    volumes:
      # Read-only: the page shows the limits and cannot change them. The same file
      # the envelope and the ladder read - one source for everyone, or what is
      # shown and what is in force diverge in silence.
      - ./policy:/policy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tikhon]

  alpaca-agent-1:
    <<: *agent-service
    environment:
      <<: *agent-environment
      # The step sized to arrive by the time patience ends. It has arithmetic
      # behind it and, until this day closes, no live day - so it runs here, on
      # the account standing LOWER, while agent 2 keeps the tick we have been
      # running. Whichever ends higher on Thursday is the one submitted, so the
      # comparison costs nothing and answers by Wednesday morning.
      EXECUTION_STRIDE: arrive
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # The broker's tools, reached through the policy gateway. The session sends
      # its own credential, so the record names WHICH agent made each call and one
      # agent can be stopped without touching the other.
      # The agent reaches the outside through the internet gateway and presents it
      # the SAME key it presents to the broker and the model. The key travels as
      # the password in the proxy's address - that is how any standard client sends
      # it, and the gateway reads it from Proxy-Authorization. Without the key it
      # would see only a TCP connection and would record the container's name
      # marked "claimed"; with the key the agent's identity is verified, as it is
      # everywhere else.
      HTTP_PROXY: ${AGENT_1_OUTBOUND_PROXY:-http://agent:${AGENT_1_BROKER_MCP_TOKEN}@swiftward-hackathon-server:8097}
      HTTPS_PROXY: ${AGENT_1_OUTBOUND_PROXY:-http://agent:${AGENT_1_BROKER_MCP_TOKEN}@swiftward-hackathon-server:8097}
      BROKER_MCP_URL: ${AGENT_1_BROKER_MCP_URL}
      # Where the harness's READS go - prices, the clock, the account, chains. An
      # empty value means "the same place the orders go". They can be separated
      # because the line above also lands in the session's own configuration as
      # [mcp_servers.broker], that is, it is the address an ORDER leaves by: its
      # place is the gateway, which can refuse it and records that it happened.
      # Reads carry no orders.
      BROKER_MCP_TOKEN: ${AGENT_1_BROKER_MCP_TOKEN}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      # The model through the policy gateway, under this agent's own name.
      MODEL_GATEWAY_URL: ${AGENT_1_MODEL_GATEWAY_URL}
      DECLARATION: ${AGENT_1_DECLARATION:-/mnt/agent/alpaca-agent-1.yaml}
      GATEWAY_TOKEN: ${AGENT_1_GATEWAY_TOKEN}
      # The ladder reads the SAME ruleset the envelope serves, so what one
      # position may lose stops being advice at the last point our code holds an
      # order. The session still discovers its limits by asking; this is the
      # backstop under it.
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: alpaca-agent-1
      TELEGRAM_BOT_TOKEN: ${AGENT_1_TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${AGENT_1_TELEGRAM_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
    volumes:
      # ONE FILE, not the directory it lives in. The entrypoint reads exactly
      # `auth.json`, while `~/.codex` on a developer's machine holds every session
      # that person has ever run - other projects, other people's work, years of
      # transcripts and generated files. Mounting the directory put all of it
      # inside a container whose model has a shell, one poisoned headline away
      # from reading it. Measured 29 August on this machine: 4.6 GB, 475 session
      # files. CODEX_AUTH_FILE names the file directly where it is not simply
      # auth.json inside CODEX_AUTH_DIR.
      - ${CODEX_AUTH_FILE:-${CODEX_AUTH_DIR}/auth.json}:/mnt/codex/auth.json:ro
      - codex-home:/home/agent/.codex
      # The full trace of the agent's work, onto the host rather than only into
      # that volume. codex writes a rollout here for every thread: what was fed in,
      # which tools were called and with what answer, what the agent said in reply.
      # Postgres beside it holds the same thing broken into tables, but does NOT
      # hold the texts - neither the task nor the answer. A week's work can only be
      # reviewed from this file, and inside a volume it is out of reach without
      # docker cp.
      - ./transcripts:/home/agent/.codex/sessions
      - agent-work:/work
      - ./policy:/policy:ro
      # The skills come from the checkout rather than the image - into the SOURCE,
      # not into the directory the session reads. The difference matters: the
      # application itself copies from here into /work/.agents/skills the playbooks
      # the declaration names, so the narrowing works the same here as in
      # production. Had we mounted over the session's directory it would get ALL
      # the checkout's playbooks, and locally we would watch behaviour other than
      # the one that ships - the more so because both agents mount the same
      # checkout while their `skills:` sets differ.
      # An edit still reaches an ALREADY RUNNING session: on the same tick that
      # re-reads the declaration, the harness rebuilds the directory if the text
      # changed.
      - ./agent/skills:/mnt/skills:ro
      # The declaration comes from the checkout rather than the image, for the same
      # reason as the skills, and this is exactly the trap we have already fallen
      # into: an edit in `alpaca-agent-tikhon.yaml` passes the tests while the deployment runs the
      # baked version and says nothing about it. It showed only in the `sessions:`
      # line in the log, and then only if you knew where to look. A DIRECTORY is
      # mounted here because the two agents take different files from it. In
      # production (`compose.prod.yaml`) there is no such mount: there the
      # deployment must run exactly what CI built.
      - ./agent:/mnt/agent:ro

  # The second account: the same engine selling NEARER the money. It keeps its
  # own record, because a shared one would let this agent's restart close the
  # other's live turns and let either skip a session the other already ran.
  #
  # It speaks in its own topic through its own bot. Sharing the first agent's bot
  # was not possible: Telegram allows one reader per bot, so the two would have
  # taken the channel from each other in turns. Its own bot also names itself in
  # the room, so which of the two is speaking is read, not inferred.
  alpaca-agent-2:
    <<: *agent-service
    environment:
      <<: *agent-environment
      # One tick a step: what this ladder has always done, kept here on purpose.
      # It is the control, and it is on the account that stands higher, so the
      # unproven tactic is never the one carrying the lead.
      EXECUTION_STRIDE: tick
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agents_near?sslmode=disable
      # The agent reaches the outside through the internet gateway and presents it
      # the SAME key it presents to the broker and the model. The key travels as
      # the password in the proxy's address - that is how any standard client sends
      # it, and the gateway reads it from Proxy-Authorization. Without the key it
      # would see only a TCP connection and would record the container's name
      # marked "claimed"; with the key the agent's identity is verified, as it is
      # everywhere else.
      HTTP_PROXY: ${AGENT_2_OUTBOUND_PROXY:-http://agent:${AGENT_2_BROKER_MCP_TOKEN}@swiftward-hackathon-server:8097}
      HTTPS_PROXY: ${AGENT_2_OUTBOUND_PROXY:-http://agent:${AGENT_2_BROKER_MCP_TOKEN}@swiftward-hackathon-server:8097}
      BROKER_MCP_URL: ${AGENT_2_BROKER_MCP_URL:-http://alpaca-mcp-agent-2:8000/mcp}
      BROKER_MCP_TOKEN: ${AGENT_2_BROKER_MCP_TOKEN}
      USER_TOKEN: ${USER_TOKEN:-}
      USER_HEADER_NAME: ${USER_HEADER_NAME:-}
      MODEL_GATEWAY_URL: ${AGENT_2_MODEL_GATEWAY_URL}
      DECLARATION: ${AGENT_2_DECLARATION:-/mnt/agent/alpaca-agent-2.yaml}
      GATEWAY_TOKEN: ${AGENT_2_GATEWAY_TOKEN}
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_IDENTITY: alpaca-agent-2
      TELEGRAM_BOT_TOKEN: ${AGENT_2_TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${AGENT_2_TELEGRAM_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
    volumes:
      # ONE FILE, not the directory it lives in. The entrypoint reads exactly
      # `auth.json`, while `~/.codex` on a developer's machine holds every session
      # that person has ever run - other projects, other people's work, years of
      # transcripts and generated files. Mounting the directory put all of it
      # inside a container whose model has a shell, one poisoned headline away
      # from reading it. Measured 29 August on this machine: 4.6 GB, 475 session
      # files. CODEX_AUTH_FILE names the file directly where it is not simply
      # auth.json inside CODEX_AUTH_DIR.
      - ${CODEX_AUTH_FILE:-${CODEX_AUTH_DIR}/auth.json}:/mnt/codex/auth.json:ro
      - codex-home-near:/home/agent/.codex
      - agent-near-work:/work
      - ./policy:/policy:ro
      # The skills come from the checkout rather than the image - into the SOURCE,
      # not into the directory the session reads. The difference matters: the
      # application itself copies from here into /work/.agents/skills the playbooks
      # the declaration names, so the narrowing works the same here as in
      # production. Had we mounted over the session's directory it would get ALL
      # the checkout's playbooks, and locally we would watch behaviour other than
      # the one that ships - the more so because both agents mount the same
      # checkout while their `skills:` sets differ.
      # An edit still reaches an ALREADY RUNNING session: on the same tick that
      # re-reads the declaration, the harness rebuilds the directory if the text
      # changed.
      - ./agent/skills:/mnt/skills:ro
      # The declaration comes from the checkout rather than the image, for the same
      # reason as the skills, and this is exactly the trap we have already fallen
      # into: an edit in `alpaca-agent-tikhon.yaml` passes the tests while the deployment runs the
      # baked version and says nothing about it. It showed only in the `sessions:`
      # line in the log, and then only if you knew where to look. A DIRECTORY is
      # mounted here because the two agents take different files from it. In
      # production (`compose.prod.yaml`) there is no such mount: there the
      # deployment must run exactly what CI built.
      - ./agent:/mnt/agent:ro

  # What the session asks about its own limits. It stands where the policy gateway
  # will stand, and answers the one question that gateway answers first: what am I
  # allowed to do, and by which version of the rules.
  #
  # It holds no broker credential and reaches nothing: it reads a file and
  # answers. Judging an order and refusing it are the gateway's, not its, and it
  # is deliberately unable to do either.
  envelope:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: envelope
    networks: [internal]
    environment:
      ROLES: envelope
      ENVELOPE_ADDR: ":8090"
      ENVELOPE_PATH: /policy/envelope.yaml
      # Which token belongs to which caller. It lives here and not in the ruleset
      # because the ruleset is committed and a token is not.
      ENVELOPE_CALLERS: ${ENVELOPE_CALLERS}
    volumes:
      # The working copy over the shipped one: an operator lowering a ceiling
      # edits this file, and the session reads the new number on its next
      # question, with nothing restarted.
      - ./policy:/policy:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The only door out. Hosts not named in docker/egress/filter.txt are refused.
  egress:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/egress.Dockerfile
      args:
        # Whatever else THIS deployment must reach, as regular expressions. The
        # address of its policy gateway goes here when the gateway is not on the
        # same machine; it is a property of the deployment, not of the project.
        EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS:-}
    networks: [internal, outbound]
    # The gateway's address is pinned because the NAME disappears in bursts.
    # Measured 27 August: two bursts in one morning, 09:57 and 11:07 New York time,
    # a few minutes each; inside a burst everything the agent sends through the
    # gateway fails - eight refusals out of eight in one turn, eight out of ten in
    # another, and in those minutes the defence sees no positions. Public resolvers
    # return the record 12 times out of 12 meanwhile, and from inside the container
    # 0 out of 5: the record itself disappears, and it is fixed not by us but by
    # whoever's node publishes it.
    #
    # All three addresses were checked one by one - each answers as the gateway
    # within a second. The hosts file is read before DNS, so for this name lookup
    # leaves the path entirely.
    #
    # The price: if the ingress moves we are pinned to a dead address. So a watcher
    # stands beside this, knocking on these addresses, and it will say when they
    # stop answering. The pinning comes off when we are given a name that does not
    # disappear.
    extra_hosts:
      - "lab.tailc50179.ts.net:185.40.234.172"
      - "lab.tailc50179.ts.net:185.40.234.210"
      - "lab.tailc50179.ts.net:185.40.234.37"
    # Outbound names are resolved HERE - both the agent and our own client go
    # through this proxy, so its resolver is shared by everyone. It has to be its
    # own: on 27 August the machine's resolver began returning NXDOMAIN for the
    # gateway's name while public ones returned it, and the deployment stopped
    # seeing the broker entirely - the error looked like "the network is down" when
    # only name lookup had broken. Docker keeps its own service-name resolution on
    # 127.0.0.11; this only sets who it asks for names OUTSIDE.
    dns: [1.1.1.1, 8.8.8.8]

networks:
  internal:
    internal: true
  outbound:

volumes:
  pgdata:
  codex-home:
  # The volume KEYS keep their old names on purpose: renaming one would create a
  # new, empty volume, and the session's notes live in the old one. What a
  # service is called and what its disk is called are separate facts.
  agent-work:
  codex-home-near:
  agent-near-work:
