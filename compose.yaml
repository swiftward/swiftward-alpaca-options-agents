name: swiftward-alpaca-options-agents

# Local stack, built from this checkout. `make up` builds and starts it.
#
# Two networks on purpose. `internal` has no route out and no published ports.
# The services that must reach the public internet - the app, which talks to the
# policy gateway, and Alpaca's server, which talks to Alpaca - also sit on
# `outbound`. The agent sits on `internal` alone, so its only ways anywhere are
# the services beside it and the egress proxy, whose allowlist it cannot widen.

services:
  postgres:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Alpaca's own MCP server. The account keys live here and nowhere else; no host
  # port, so the only caller is the policy gateway.
  alpaca-mcp:
    build:
      context: .
      dockerfile: docker/alpaca-mcp.Dockerfile
    networks: [internal, outbound]
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_API_SECRET_KEY}
      ALPACA_PAPER_TRADE: ${ALPACA_PAPER}
      ALPACA_TOOLSETS: ${ALPACA_TOOLSETS}

  # The session's container: the harness role plus the agent it starts. It holds
  # no credential of ours; the login it does carry is Codex's own, mounted from
  # the host that performed it.
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        AGENT_UID: ${AGENT_UID}
    networks: [internal]
    environment:
      ROLES: harness,api,mcp
      ADDR: ":8080"
      MCP_ADDR: ":8081"
      WEB_DIR: /srv/web
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AGENT_COMMAND: codex
      AGENT_DIR: /work
      # The container is the sandbox: root filesystem read-only, one writable
      # directory, no route out except the proxy. The agent's own sandbox needs
      # user namespaces this container does not grant, and running two boundaries
      # where one is real would only stall every command.
      AGENT_SANDBOX: danger-full-access
      AGENT_MODEL: ${AGENT_MODEL}
      # Kept in the work volume, so a restart continues the same conversation.
      THREAD_FILE: /work/.thread
      WAKEUP_FILE: /work/wakeups.json
      # One request to the agent may take this long. Past it the chat is told,
      # rather than the whole room waiting on a session that stopped answering.
      AGENT_CALL_TIMEOUT: ${AGENT_CALL_TIMEOUT}
      SESSION_MCP_URL: http://127.0.0.1:8081
      # Set only while the gateway is not yet in front of the broker, and only on
      # a development account.
      BROKER_MCP_URL: ${BROKER_MCP_URL}
      DECLARATION: ${DECLARATION:-/agent/agent.yaml}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: alpaca-mcp,postgres,egress,localhost,127.0.0.1
      CODEX_HOME: /home/agent/.codex
    volumes:
      - ${CODEX_AUTH_DIR}:/mnt/codex:ro
      - codex-home:/home/agent/.codex
      - agent-work:/work
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [session]

  # The only door out. Hosts not named in docker/egress/filter.txt are refused.
  egress:
    build:
      context: .
      dockerfile: docker/egress.Dockerfile
    networks: [internal, outbound]

networks:
  internal:
    internal: true
  outbound:

volumes:
  pgdata:
  codex-home:
  agent-work:
