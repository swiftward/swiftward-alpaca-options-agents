[project]
name = "research"
version = "0.1.0"
description = "The measurements behind the numbers the agent trades on"
readme = "README.md"
authors = [
    { name = "Tikhon Slasten", email = "slasten32@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[project.scripts]
research = "research:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
