name: swiftward-alpaca-options-agents-prod

# Same stack as compose.yaml with one change: first-party services pull published
# images at ${IMAGE_TAG} instead of building. Rationale for each service lives once,
# in compose.yaml - the two files must not carry two copies of it that drift apart.

services:
  postgres:
    image: postgres:18.4-alpine
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The schema, applied before anything reads it. Files run in name order, and
  # each is written to be safe to run again, so a restart is not a special case.
  # Схема приезжает образом, собранным из того же коммита, что и остальные. Файлов
  # с диска этой машины она не читает: иначе накатывалось бы то, что лежит в
  # чекауте, а работал бы код из образа, и совпадали бы они только пока за этим
  # кто-то следит.
  migrate:
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/migrate:${IMAGE_TAG}
    networks: [internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      RECORD_DATABASES: ${RECORD_DATABASES:-${POSTGRES_DB}}
    depends_on:
      postgres:
        condition: service_healthy

  alpaca-mcp:
    restart: unless-stopped
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/alpaca-mcp:${IMAGE_TAG}
    networks: [internal, outbound]
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_API_SECRET_KEY}
      ALPACA_PAPER_TRADE: ${ALPACA_PAPER}
      ALPACA_TOOLSETS: ${ALPACA_TOOLSETS}

  page:
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/page:${IMAGE_TAG}
    networks: [internal, outbound]
    environment:
      ROLES: api
      ADDR: ":8080"
      WEB_DIR: /srv/web
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RECORD_SHOWS: ${RECORD_SHOWS}
      # The read side asks the broker what the account is worth. It only reads:
      # the money questions have no order in them.
      BROKER_MCP_URL: ${BROKER_MCP_URL}
      BROKER_MCP_TOKEN: ${PAGE_MCP_TOKEN}
      ORDERS_SHOWN: ${ORDERS_SHOWN}
      HISTORY_DAYS: ${HISTORY_DAYS}
    # Своего порта наружу у страницы нет: наружу смотрит только прокси, и он же
    # держит сертификат. Порт остаётся внутренним, доступным прокси по имени.
    # The week runs unattended: a machine that reboots at three in the morning
    # must come back with the agent running, not with it waiting to be started.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent:
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/agent:${IMAGE_TAG}
    networks: [internal]
    environment:
      ROLES: harness,mcp
      MCP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RECORD_SHOWS: ${RECORD_SHOWS}
      AGENT_COMMAND: codex
      AGENT_DIR: /work
      # The container is the sandbox: root filesystem read-only, one writable
      # directory, no route out except the proxy. The agent's own sandbox needs
      # user namespaces this container does not grant, and running two boundaries
      # where one is real would only stall every command.
      AGENT_SANDBOX: danger-full-access
      AGENT_MODEL: ${AGENT_MODEL}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT}
      # Kept in the work volume, so a restart continues the same conversation.
      THREAD_FILE: /work/.thread
      WAKEUP_FILE: /work/wakeups.json
      # One request to the agent may take this long. Past it the chat is told,
      # rather than the whole room waiting on a session that stopped answering.
      AGENT_CALL_TIMEOUT: ${AGENT_CALL_TIMEOUT}
      # Дольше этого один ход не живёт: за ним ждут другие сессии, и защита,
      # которая не отработала из-за длинного перебора, хуже перебора.
      TURN_LIMIT: ${TURN_LIMIT}
      # Пауза между тем, что комната слышит от сессии. Тринадцать сессий по
      # четыре реплики - это отказ Telegram, за которым ждёт нужный ответ.
      SAY_EVERY: ${SAY_EVERY}
      SESSION_MCP_URL: http://127.0.0.1:8081
      # Set only while the gateway is not yet in front of the broker, and only on
      # a development account.
      BROKER_MCP_URL: ${BROKER_MCP_URL}
      # The volatility history the entry rules compare against. It is worth what
      # its length is, so it starts on the first day and is never paused.
      VOLATILITY_UNDERLYINGS: ${VOLATILITY_UNDERLYINGS}
      VOLATILITY_EVERY: ${VOLATILITY_EVERY}
      # How often the account's own value is written down: the week is judged on
      # the line those readings draw.
      ACCOUNT_EVERY: ${ACCOUNT_EVERY}
      # The ladder that walks an unfilled structure toward the price the book
      # shows. It finishes what a session started and can open nothing.
      EXECUTION_EVERY: ${EXECUTION_EVERY}
      EXECUTION_STEP: ${EXECUTION_STEP}
      EXECUTION_PATIENCE: ${EXECUTION_PATIENCE}
      DECLARATION: ${DECLARATION:-/agent/agent.yaml}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID}
      TELEGRAM_ALLOW_USER_IDS: ${TELEGRAM_ALLOW_USER_IDS}
      GATEWAY_URL: ${GATEWAY_URL:-http://envelope:8090/mcp}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      # Откуда берутся приёмы. В развёрнутом стенде - из образа: чекаута здесь
      # нет, и правка текста приёма приезжает новым образом, как и всё остальное.
      SKILLS_DIR: /agent/skills
      # Кем этот процесс представляется конверту: лестница читает тот же предел
      # позиции, по которому сессии велено считать размер.
      ENVELOPE_IDENTITY: ${ENVELOPE_IDENTITY}
      # Ключ к брокеру, когда путь к нему идёт через шлюз.
      BROKER_MCP_TOKEN: ${BROKER_MCP_TOKEN}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL}
      # Что скринер просматривает и что считает годным к показу. Разбор -
      # docs/screener.md; пустой список бумаг выключает и проход, и инструмент
      # кандидатов у сессии, молча.
      SCREENER_UNDERLYINGS: ${SCREENER_UNDERLYINGS}
      SCREENER_EVERY: ${SCREENER_EVERY}
      SCREENER_PER_MINUTE: ${SCREENER_PER_MINUTE}
      SCREENER_EXPIRATIONS: ${SCREENER_EXPIRATIONS}
      SCREENER_NEAREST: ${SCREENER_NEAREST}
      SCREENER_FURTHEST: ${SCREENER_FURTHEST}
      SCREENER_LEAST_PAID: ${SCREENER_LEAST_PAID}
      SCREENER_MOST_PAID: ${SCREENER_MOST_PAID}
      SCREENER_MOST_DELTA: ${SCREENER_MOST_DELTA}
      SCREENER_LEAST_EDGE: ${SCREENER_LEAST_EDGE}
      SCREENER_DEAREST: ${SCREENER_DEAREST}
      THREAD_RESUME_LIMIT: ${THREAD_RESUME_LIMIT}
      HTTP_PROXY: ${OUTBOUND_PROXY:-http://egress:8888}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-http://egress:8888}
      NO_PROXY: alpaca-mcp,envelope,postgres,egress,localhost,127.0.0.1
      CODEX_HOME: /home/agent/.codex
    volumes:
      - ${CODEX_AUTH_DIR}:/mnt/codex:ro
      - codex-home:/home/agent/.codex
      # Полный след работы агента на диск машины, а не только в том. codex пишет
      # сюда rollout по каждому треду: что подано на вход, какие инструменты
      # вызваны и с каким ответом, что агент ответил. Postgres рядом держит то же
      # разобранным по таблицам, но текстов - ни задачи, ни ответа - не держит.
      # За неделю судейства это единственная запись, по которой можно показать,
      # ЧТО агент делал, а не только что у него получилось.
      - ./transcripts:/home/agent/.codex/sessions
      - agent-work:/work
    # The claims the architecture makes about this container, enforced here: it
    # cannot write outside its work directory, cannot gain privileges, and holds
    # no capability it was not given.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [session]

  # Единственное, что смотрит наружу. Держит сертификат и отдаёт страницу по
  # домену: судья открывает адрес руками, и он обязан отвечать по https.
  #
  # Сертификат берётся и продлевается сам, по вызову на 80-м порту. Поэтому 80-й
  # опубликован, хотя ничего, кроме перенаправления на 443, не отдаёт.
  #
  # Сокета докера у него нет намеренно: сокет в контейнере - это право поднять
  # любой другой контейнер на машине, а этот контейнер единственный смотрит в
  # интернет. Маршрут у нас один и не меняется, поэтому он описан файлом.
  traefik:
    image: traefik:v3.7.12
    networks: [internal, outbound]
    command:
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http
      - --log.level=INFO
      - --accesslog=true
    environment:
      # Домен, по которому судья открывает страницу. Подставляется в правило
      # маршрута; проверено запуском, что файловый провайдер это умеет.
      DASHBOARD_HOST: ${DASHBOARD_HOST}
    volumes:
      - ./docker/traefik:/etc/traefik/dynamic:ro
      - acme:/acme
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    cap_drop: [ALL]
    # Порты ниже 1024 иначе не занять, а занять их надо: судья открывает адрес
    # без порта в нём.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - page

  # Что сессия спрашивает про свои пределы. Файл монтируется из чекаута, а не
  # берётся из образа: опустить потолок должно быть одной правкой, которую
  # работающая сессия видит на следующем вопросе.
  envelope:
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/envelope:${IMAGE_TAG}
    networks: [internal]
    environment:
      ROLES: envelope
      ENVELOPE_ADDR: ":8090"
      ENVELOPE_PATH: /policy/envelope.yaml
      ENVELOPE_CALLERS: ${ENVELOPE_CALLERS}
    # Правила приезжают образом, как и схема: файла с диска этой машины здесь нет.
    # Локально они монтируются из чекаута - там потолок опускают на живом стенде и
    # проверяют, что сессия читает новое число на следующем вопросе. В бою этого
    # никто не делает, а лишний файл рядом со стеком расходится с образом ровно
    # так же тихо, как расходились миграции.
    #
    # Если однажды понадобится опустить потолок, не пересобирая: смонтировать
    # файл на /policy/envelope.yaml, он перекроет тот, что в образе. Служба
    # перечитывает его на каждый вопрос, поэтому перезапуск не нужен и там.
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  egress:
    restart: unless-stopped
    image: ghcr.io/swiftward/swiftward-alpaca-options-agents/egress:${IMAGE_TAG}
    networks: [internal, outbound]

networks:
  internal:
    internal: true
  outbound:

volumes:
  acme:
  pgdata:
  codex-home:
  agent-work:
